<body class="game-page" data-game="english"><div class="app">
<header><a class="home" href="index.html" target="_top">☾ <span>MOON</span> GAMES　 /　もどる</a><button id="sound" class="sound" aria-pressed="false">🔊 おと あり</button></header>
<main>
<section id="home"><div class="intro"><div class="eyebrow">LITTLE ENGLISH GARDEN</div><div class="garden" aria-hidden="true"><span>🌼</span><span>🐰</span><span>🌱</span></div><h1>えいごの おにわ</h1><p>どの おにわに いく？</p></div><div id="categories" class="categories"></div></section>
<section id="learn" hidden><div class="screen-head"><button class="back" data-home>← おにわへ</button><h2 id="learn-title"></h2></div><div class="learn-copy"><p class="subtitle">えを おすと、えいごが きこえるよ</p></div><div id="learn-grid" class="learn-grid"></div><button class="primary" id="start">あてっこ する →</button></section>
<section id="quiz" hidden><div class="screen-head"><button class="back" data-home>← おにわへ</button><div class="progress"><span id="count"></span><span class="stars" id="stars" aria-label="あつめた ほし"></span></div></div><div class="question"><h2>どの えかな？</h2><button id="listen" class="listen">🔊 もういちど きく<span class="english" id="english" lang="en"></span></button><div><button id="hint-toggle" class="hint-toggle">💡 ヒントを みる</button></div><p id="hint" class="hint" hidden></p></div><div id="choices" class="choices"></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><div class="next-space"><button id="next" class="primary" hidden>つぎへ →</button></div></section>
<section id="finish" class="finish" hidden><div class="finish-art" aria-hidden="true">🌻</div><h2>ぜんぶ できたね！</h2><div class="stars" aria-label="ほし 5こ">★★★★★</div><p>きょうの ことば</p><div id="reviewWords" class="review-words" aria-label="みつけた えいご"></div><button id="again" class="primary">もういちど あそぶ</button><button class="secondary" data-home>ほかの おにわへ →</button></section>
<p id="audio-note" class="note" role="status"></p>
</main><footer>LISTEN · FIND · GROW</footer>
</div>
<script>
'use strict';
document.querySelector('meta[name="theme-color"]').content='#151918';
const DATA={animals:{name:'どうぶつ',en:'ANIMALS',icon:'🐻',words:[['dog','いぬ','🐶'],['cat','ねこ','🐱'],['rabbit','うさぎ','🐰'],['bear','くま','🐻'],['lion','らいおん','🦁'],['elephant','ぞう','🐘']]},food:{name:'たべもの',en:'FOOD',icon:'🍓',words:[['apple','りんご','🍎'],['banana','ばなな','🍌'],['strawberry','いちご','🍓'],['grapes','ぶどう','🍇'],['bread','ぱん','🍞'],['ice cream','あいす','🍦']]},colors:{name:'いろ',en:'COLORS',icon:'🎨',words:[['red','あか','#ec4b47'],['blue','あお','#388bdc'],['yellow','きいろ','#f4cc3e'],['green','みどり','#45a467'],['pink','ぴんく','#f28fb5'],['purple','むらさき','#9563c4']]}};
const $=id=>document.getElementById(id);
let screen='home',category='animals',deck=[],position=0,answered=false,muted=false,speechToken=0,audioFailed=false,questionVersion=0;
let runId='',firstTry=0,attempted=false;
const synth=window.speechSynthesis;
function stopSpeech(){speechToken++;if(synth)try{synth.cancel()}catch{}}
function show(id){questionVersion++;stopSpeech();screen=id;['home','learn','quiz','finish'].forEach(x=>$(x).hidden=x!==id);$('audio-note').textContent=muted?'おとは おやすみ。えと ヒントで あそべるよ。':'';window.scrollTo({top:0,behavior:'instant'});}
function art(word){const span=document.createElement('span');span.setAttribute('aria-hidden','true');if(word[2].startsWith('#')){span.className='swatch';span.style.background=word[2]}else{span.className='word-art';span.textContent=word[2]}return span}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function revealHint(){if(screen!=='quiz')return;$('hint').hidden=false;$('hint').textContent='「'+deck[position][1]+'」を さがしてね';$('hint-toggle').setAttribute('aria-expanded','true')}
function unavailable(){audioFailed=true;$('audio-note').textContent='こえが でないときは、ヒントを みて あそんでね。';revealHint()}
function speak(word){stopSpeech();if(muted||document.hidden)return;if(!synth||!window.SpeechSynthesisUtterance){unavailable();return}const token=speechToken;try{const u=new SpeechSynthesisUtterance(word[0]);u.lang='en-US';u.rate=.78;u.pitch=1.08;const voices=synth.getVoices();const voice=voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(voice)u.voice=voice;else if(voices.length){unavailable();return}u.onerror=()=>{if(token===speechToken)unavailable()};synth.speak(u)}catch{if(token===speechToken)unavailable()}}
function openGarden(key){category=key;show('learn');const version=questionVersion;$('learn-title').textContent=DATA[key].icon+' '+DATA[key].name;$('learn-grid').replaceChildren();for(const word of DATA[key].words){const b=document.createElement('button');b.className='word-card';b.setAttribute('aria-label',word[1]+'、'+word[0]+' をきく');b.append(art(word));const en=document.createElement('strong');en.lang='en';en.textContent=word[0];const ja=document.createElement('small');ja.textContent=word[1];b.append(en,ja);b.onclick=()=>{if(screen==='learn'&&category===key&&version===questionVersion)speak(word)};$('learn-grid').append(b)}}
function start(){deck=shuffle(DATA[category].words).slice(0,5);position=0;firstTry=0;runId=window.crypto?.randomUUID?.()||'english-'+Date.now()+'-'+Math.random().toString(36).slice(2);show('quiz');question()}
function finishRound(){
 show('finish');
 const version=questionVersion;
 $('reviewWords').replaceChildren();
 for(const word of deck){
  const button=document.createElement('button');button.type='button';button.className='review-word';
  button.setAttribute('aria-label',word[1]+'、'+word[0]+' をきく');button.append(art(word));
  const en=document.createElement('strong');en.lang='en';en.textContent=word[0];
  const ja=document.createElement('small');ja.textContent=word[1];button.append(en,ja);
  button.onclick=()=>{if(screen==='finish'&&version===questionVersion)speak(word)};
  $('reviewWords').append(button);
 }
 window.MoonRanking?.complete({game:'english',mode:category,runId,metrics:{firstTry,completed:5,total:5}});
}
function question(){const version=++questionVersion;stopSpeech();answered=false;attempted=false;$('next').hidden=true;$('feedback').textContent='きいて、えを おしてね';$('hint').hidden=true;$('hint-toggle').setAttribute('aria-expanded','false');$('count').textContent=(position+1)+' / 5';$('stars').textContent='★'.repeat(position)+'☆'.repeat(5-position);const target=deck[position];$('english').textContent=target[0];$('choices').replaceChildren();const options=shuffle([target,...shuffle(DATA[category].words.filter(w=>w!==target)).slice(0,2)]);for(const word of options){const b=document.createElement('button');b.className='choice';b.setAttribute('aria-label',word[1]);b.append(art(word));const label=document.createElement('span');label.className='label';label.textContent=word[1];b.append(label);b.onclick=()=>{if(screen!=='quiz'||version!==questionVersion||answered)return;if(word!==target){attempted=true;b.classList.add('retry');$('feedback').textContent='もういちど やってみよう！';speak(target);return}answered=true;if(!attempted)firstTry++;stopSpeech();b.classList.remove('retry');b.classList.add('correct');for(const choice of $('choices').children)choice.disabled=true;$('stars').textContent='★'.repeat(position+1)+'☆'.repeat(4-position);$('feedback').textContent='🌼 せいかい！ '+target[0];$('next').textContent=position===4?'ごほうびを みる ★':'つぎへ →';$('next').hidden=false;speak(target)};$('choices').append(b)}if(muted||audioFailed||!synth)revealHint();speak(target)}
for(const [key,group] of Object.entries(DATA)){const b=document.createElement('button');b.className='category';const a=document.createElement('span');a.className='art';a.textContent=group.icon;a.setAttribute('aria-hidden','true');const name=document.createElement('strong');name.textContent=group.name;const en=document.createElement('small');en.lang='en';en.textContent=group.en;b.append(a,name,en);b.onclick=()=>openGarden(key);$('categories').append(b)}
$('start').onclick=start;$('again').onclick=start;$('next').onclick=()=>{if(screen!=='quiz'||!answered)return;answered=false;position++;if(position===5)finishRound();else question()};$('listen').onclick=()=>{if(screen==='quiz')speak(deck[position])};$('hint-toggle').onclick=revealHint;document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));$('sound').onclick=()=>{muted=!muted;stopSpeech();$('sound').textContent=muted?'🔇 おと なし':'🔊 おと あり';$('sound').setAttribute('aria-pressed',String(muted));$('audio-note').textContent=muted?'おとは おやすみ。えと ヒントで あそべるよ。':'';if(muted)revealHint();else if(screen==='quiz')speak(deck[position])};document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech()});window.addEventListener('pagehide',stopSpeech);
if(!synth||!window.SpeechSynthesisUtterance)unavailable();
