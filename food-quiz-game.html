.card:nth-child(2) { background: #343329; border-color: #5b5439; }
.card:nth-child(3) { background: #263439; border-color: #3d555a; }
.card:not(:disabled):hover { border-color: var(--mint); }

.food-name { font-size: 20px; line-height: 1.5; font-weight: 900; overflow-wrap: anywhere; margin-top: 8px; }

<script src="food-quiz-bank.js?v=20260906-1000"></script>
<script>
'use strict';
window.FoodQuiz = (() => {
  const bank = window.FoodQuizBank;
  const $ = id => document.getElementById(id);
  if (!bank || !Array.isArray(bank.questions) || !Array.isArray(bank.foods)) {
    $('difficultyHelp').textContent = 'くいずを よみこめなかったよ。ぺーじを ひらきなおしてね。';
    $('startButton').disabled = true;
    return { getState: () => ({ phase: 'unavailable' }) };
  }
  const foods = bank.foods, questions = bank.questions, levels = bank.levels;
  const foodById = new Map(foods.map(food => [food.id, food]));
  const levelById = new Map(levels.map(level => [level.id, level]));
  const pools = new Map(levels.map(level => [level.id, questions.filter(q => q.difficulty === level.id)]));
  const seen = new Map(levels.map(level => [level.id, new Set()]));
  const levelButtons = [...$('difficultyChoices').querySelectorAll('[data-difficulty]')];
  const svg = id => foodById.get(id).svg;
  function shuffle(items) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  let phase = 'start', difficulty = 'easy', deck = [], index = 0;
  let answered = false, stars = 0, sound = true, speechToken = 0, session = 0;
  function stopSpeech() {
    speechToken++;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }
  function speak(text) {
    stopSpeech();
    if (!sound || document.hidden) return;
    if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
      $('audioNote').hidden = false;
      return;
    }
    const token = speechToken;
    try {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = .83;
      const voice = speechSynthesis.getVoices().find(v => v.lang.startsWith('ja'));
      if (voice) utterance.voice = voice;
      utterance.onerror = event => {
        if (token === speechToken && sound && !['canceled', 'interrupted'].includes(event.error)) $('audioNote').hidden = false;
      };
      speechSynthesis.speak(utterance);
    } catch { $('audioNote').hidden = false; }
  }
  function selectDifficulty(value) {
    if (phase !== 'start' || !levelById.has(value)) return;
    difficulty = value;
    const level = levelById.get(value);
    for (const button of levelButtons) {
      const selected = button.dataset.difficulty === value;
      button.setAttribute('aria-checked', String(selected));
      button.tabIndex = selected ? 0 : -1;
    }
    $('difficultyHelp').textContent = level.description + ' ごもんずつ あそぶよ。';
    $('levelLabel').textContent = level.name;
  }
  function setPhase(value) {
    phase = value;
    document.body.dataset.phase = value;
    for (const name of ['start', 'play', 'finish']) $(name).hidden = name !== value;
  }
  function buildDeck() {
    const pool = pools.get(difficulty), history = seen.get(difficulty);
    const selected = [], targets = new Set();
    let available = shuffle(pool.filter(q => !history.has(q.id)));
    while (selected.length < 5) {
      if (!available.length) {
        history.clear();
        available = shuffle(pool.filter(q => !selected.some(prior => prior.id === q.id)));
      }
      let position = available.findIndex(q => !targets.has(q.answer));
      if (position < 0) position = 0;
      const [question] = available.splice(position, 1);
      selected.push({ ...question, choices: shuffle(question.choices) });
      targets.add(question.answer);
      history.add(question.id);
    }
    return selected;
  }
  function updateProgress() {
    $('stars').innerHTML = Array.from({ length: 5 }, (_, i) => '<span class="' + (i < stars ? 'earned' : '') + '">' + (i < stars ? '★' : '☆') + '</span>').join('');
    $('stars').setAttribute('aria-label', 'ほし ' + stars + ' こ');
    $('progressLabel').textContent = (index + 1) + ' / 5';
  }
  function showQuestion() {
    answered = false;
    const question = deck[index], currentSession = session;
    $('prompt').textContent = question.clue;
    $('feedback').textContent = 'えを たっぷしてね';
    $('feedback').className = 'feedback';
    $('next').hidden = true;
    $('cards').replaceChildren();
    for (const id of question.choices) {
      const food = foodById.get(id), button = document.createElement('button');
      button.type = 'button';
      button.className = 'card';
      button.dataset.answer = id;
      button.setAttribute('aria-label', food.name);
      button.innerHTML = svg(id) + '<span class="food-name">' + food.name + '</span>';
      button.addEventListener('click', () => {
        if (currentSession === session && deck[index] === question && button.isConnected) choose(id, button);
      });
      $('cards').append(button);
    }
    updateProgress();
    $('prompt').focus({ preventScroll: true });
    speak(question.clue);
  }
  function start() {
    if (phase !== 'start' && phase !== 'finish') return;
    stopSpeech();
    session++;
    deck = buildDeck();
    index = 0;
    stars = 0;
    answered = false;
    setPhase('play');
    showQuestion();
  }
  function returnToStart() {
    stopSpeech();
    session++;
    deck = [];
    index = 0;
    stars = 0;
    answered = false;
    $('cards').replaceChildren();
    $('audioNote').hidden = true;
    setPhase('start');
    selectDifficulty(difficulty);
    levelButtons.find(button => button.dataset.difficulty === difficulty).focus({ preventScroll: true });
  }
  function choose(id, button) {
    if (phase !== 'play' || answered) return;
    const question = deck[index];
    if (id !== question.answer) {
      $('feedback').textContent = 'もういちど えらんでみよう！';
      speak('もういちど えらんでみよう！ ' + question.clue);
      return;
    }
    answered = true;
    stars++;
    button.classList.add('correct');
    $('cards').querySelectorAll('button').forEach(card => { card.disabled = true; });
    const name = foodById.get(id).name;
    $('feedback').textContent = 'せいかい！ ' + name + ' だね！';
    $('feedback').className = 'feedback success';
    $('next').textContent = index === 4 ? 'できた！ →' : 'つぎへ →';
    $('next').hidden = false;
    updateProgress();
    $('next').focus({ preventScroll: true });
    speak('せいかい！ ' + name + ' だね！');
  }
  function next() {
    if (phase !== 'play' || !answered) return;
    if (index < 4) { index++; showQuestion(); return; }
    setPhase('finish');
    $('finishLevel').textContent = levelById.get(difficulty).name + '、ごもん できたよ！';
    $('finishFoods').innerHTML = deck.map(question => svg(question.answer)).join('');
    $('finishTitle').focus({ preventScroll: true });
    speak('ぜんぶ できたね！ おいしい ものを いつつ みつけたね。');
  }
  for (const button of levelButtons) {
    const level = levelById.get(button.dataset.difficulty);
    button.innerHTML = level.name + '<small>' + pools.get(level.id).length + 'もん</small>';
    button.addEventListener('click', () => selectDifficulty(button.dataset.difficulty));
    button.addEventListener('keydown', event => {
      const direction = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
      if (!direction && event.key !== 'Home' && event.key !== 'End') return;
      event.preventDefault();
      const position = event.key === 'Home' ? 0 : event.key === 'End' ? levelButtons.length - 1 : (levelButtons.indexOf(button) + direction + levelButtons.length) % levelButtons.length;
      const target = levelButtons[position];
      selectDifficulty(target.dataset.difficulty);
      target.focus();
    });
  }
  $('hero').innerHTML = svg(foodById.has('onigiri') ? 'onigiri' : foods[0].id);
  $('startButton').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('changeDifficulty').addEventListener('click', returnToStart);
  $('finishDifficulty').addEventListener('click', returnToStart);
  $('next').addEventListener('click', next);
  $('listen').addEventListener('click', () => { if (phase === 'play') speak(deck[index].clue); });
  $('sound').addEventListener('click', () => {
    sound = !sound;
    stopSpeech();
    $('sound').setAttribute('aria-pressed', String(sound));
    $('soundLabel').textContent = sound ? 'こえ あり' : 'こえ なし';
    $('listen').disabled = !sound;
    if (!sound) $('audioNote').hidden = true;
    if (sound) speak(phase === 'play' ? deck[index].clue : 'ごはん なあに？');
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopSpeech(); });
  window.addEventListener('pagehide', stopSpeech);
  selectDifficulty(difficulty);
  return {
    foods: foods.map(food => ({ ...food })),
    questions: questions.map(question => ({ ...question, choices: [...question.choices] })),
    levels: levels.map(level => ({ ...level })),
    getState: () => ({ phase, difficulty, index, answered, stars, questionId: deck[index]?.id ?? null,
      question: deck[index] ? { ...deck[index], choices: [...deck[index].choices] } : null,
      deck: deck.map(question => ({ ...question, choices: [...question.choices] })) })
  };
})();
</script>
</body>
</html>
