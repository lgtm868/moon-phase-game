<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="おつきさま">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#15213a">
  <title>おつきさまのかたち</title>
  <style>
    :root {
      color-scheme: dark;
      --sky: #15213a;
      --sky-2: #26374f;
      --sun: #ffd568;
      --sun-deep: #ff9c45;
      --earth: #68c7c2;
      --land: #7dd77b;
      --moon: #f5f0dc;
      --moon-dark: #354052;
      --ink: #fff8df;
      --panel: rgba(255, 248, 223, 0.1);
      --line: rgba(255, 248, 223, 0.24);
      --button: #fff2b7;
      --button-ink: #283047;
      --button-shadow: rgba(0, 0, 0, 0.24);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--sky);
      color: var(--ink);
      overflow: hidden;
    }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      padding: max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 18% 14%, rgba(255, 213, 104, 0.18), transparent 22%),
        linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 100%);
    }

    main {
      width: min(100%, 460px);
      min-height: calc(100svh - 16px);
      display: grid;
      grid-template-rows: minmax(238px, 1fr) auto auto auto auto;
      gap: 6px;
    }

    header {
      display: none;
      gap: 0;
      padding: 2px 4px 0;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.22;
      letter-spacing: 0;
      color: #fff5c7;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
    }

    .hint {
      margin: 0;
      font-size: clamp(14px, 4vw, 18px);
      line-height: 1.35;
      color: rgba(255, 248, 223, 0.9);
    }

    .scene {
      position: relative;
      min-height: 238px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at 68% 22%, rgba(255, 248, 223, 0.1) 0 1px, transparent 2px),
        radial-gradient(circle at 28% 66%, rgba(255, 248, 223, 0.11) 0 1px, transparent 2px),
        radial-gradient(circle at 78% 72%, rgba(255, 248, 223, 0.1) 0 1px, transparent 2px),
        rgba(8, 15, 31, 0.34);
      box-shadow: inset 0 0 42px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    #space {
      width: 100%;
      height: 100%;
      min-height: 238px;
      display: block;
    }

    .phase-strip {
      display: grid;
      grid-template-columns: minmax(92px, 120px) minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    #phaseMoon {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.32));
    }

    .phase-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .small-label {
      font-size: clamp(13px, 3.7vw, 16px);
      color: rgba(255, 248, 223, 0.82);
      line-height: 1.25;
    }

    .phase-name {
      min-height: 40px;
      font-size: clamp(28px, 8vw, 42px);
      line-height: 1.05;
      font-weight: 800;
      color: #fff1a9;
      text-wrap: balance;
    }

    .phase-message {
      min-height: 42px;
      font-size: clamp(15px, 4.2vw, 19px);
      line-height: 1.35;
      color: rgba(255, 248, 223, 0.95);
    }

    .phase-picker {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .phase-choice {
      min-height: 34px;
      padding: 5px 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 248, 223, 0.1);
      color: rgba(255, 248, 223, 0.92);
      font-size: clamp(12px, 3.1vw, 14px);
      font-weight: 800;
      line-height: 1.05;
      box-shadow: none;
    }

    .phase-choice:active {
      transform: none;
      box-shadow: none;
      background: rgba(255, 242, 183, 0.22);
    }

    .phase-choice.is-active {
      background: var(--button);
      color: var(--button-ink);
      border-color: transparent;
    }

    .sprunki-picker {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
    }

    .sprunki-choice {
      min-height: 42px;
      padding: 4px 2px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 248, 223, 0.1);
      color: rgba(255, 248, 223, 0.92);
      font-size: clamp(11px, 2.8vw, 13px);
      font-weight: 800;
      line-height: 1.05;
      box-shadow: none;
    }

    .sprunki-choice:active {
      transform: none;
      box-shadow: none;
      background: rgba(255, 242, 183, 0.22);
    }

    .sprunki-choice.is-active {
      background: var(--button);
      color: var(--button-ink);
      border-color: transparent;
    }

    .sprunki-dot {
      display: block;
      width: 17px;
      height: 17px;
      margin: 0 auto 3px;
      border: 2px solid rgba(0, 0, 0, 0.35);
      border-radius: 50%;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.28);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding-bottom: 2px;
    }

    button {
      appearance: none;
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      background: var(--button);
      color: var(--button-ink);
      font: inherit;
      font-weight: 800;
      font-size: clamp(15px, 4.1vw, 18px);
      line-height: 1.1;
      box-shadow: 0 5px 0 #e2b85d, 0 10px 18px var(--button-shadow);
      cursor: pointer;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #e2b85d, 0 5px 12px var(--button-shadow);
    }

    .button-icon {
      display: block;
      font-size: 23px;
      line-height: 1;
      margin-bottom: 4px;
    }

    @media (max-height: 680px) {
      body {
        padding-top: max(2px, env(safe-area-inset-top));
        padding-bottom: max(2px, env(safe-area-inset-bottom));
      }

      main {
        min-height: calc(100svh - 4px);
        grid-template-rows: minmax(170px, 1fr) auto auto auto auto;
        gap: 4px;
      }

      .scene,
      #space {
        min-height: 170px;
      }

      .phase-strip {
        grid-template-columns: 74px minmax(0, 1fr);
        gap: 8px;
        padding: 5px;
      }

      .small-label {
        font-size: 12px;
      }

      .phase-name {
        min-height: 28px;
        font-size: 24px;
      }

      .phase-message {
        min-height: 24px;
        font-size: 13px;
        line-height: 1.2;
      }

      .phase-picker {
        gap: 4px;
      }

      .phase-choice {
        min-height: 25px;
        padding: 3px 2px;
        font-size: 10px;
      }

      .sprunki-picker {
        gap: 4px;
      }

      .sprunki-choice {
        min-height: 30px;
        padding: 3px 1px;
        font-size: 9px;
      }

      .sprunki-dot {
        width: 13px;
        height: 13px;
        margin-bottom: 2px;
      }

      button {
        min-height: 38px;
        font-size: 13px;
      }

      .button-icon {
        font-size: 17px;
        margin-bottom: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main aria-label="月の満ち欠けをみるゲーム">
    <section class="scene" aria-label="太陽、地球、月の動き">
      <canvas id="space"></canvas>
    </section>

    <section class="phase-strip" aria-live="polite">
      <canvas id="phaseMoon" width="240" height="240" aria-label="地球から見える月"></canvas>
      <div class="phase-copy">
        <div class="small-label">つきの なまえ</div>
        <div class="phase-name" id="phaseName">しんげつ</div>
        <div class="phase-message" id="phaseMessage">おつきさまが みえにくいよ</div>
      </div>
    </section>

    <section class="phase-picker" id="phaseList" aria-label="月の名前から選ぶ"></section>

    <section class="sprunki-picker" id="sprunkiList" aria-label="スプランキーを選ぶ"></section>

    <nav class="controls" aria-label="ゲームのそうさ">
      <button id="playButton" type="button" aria-label="再生する">
        <span class="button-icon" aria-hidden="true">▶</span>
        うごく
      </button>
      <button id="stepButton" type="button" aria-label="ひとつ進む">
        <span class="button-icon" aria-hidden="true">➜</span>
        すすむ
      </button>
      <button id="resetButton" type="button" aria-label="最初に戻る">
        <span class="button-icon" aria-hidden="true">↺</span>
        もどる
      </button>
      <button id="musicButton" type="button" aria-label="音楽を止める">
        <span class="button-icon" aria-hidden="true">♪</span>
        おと
      </button>
    </nav>
  </main>

  <script>
    (() => {
      "use strict";

      const space = document.getElementById("space");
      const phaseMoon = document.getElementById("phaseMoon");
      const phaseName = document.getElementById("phaseName");
      const phaseMessage = document.getElementById("phaseMessage");
      const playButton = document.getElementById("playButton");
      const stepButton = document.getElementById("stepButton");
      const resetButton = document.getElementById("resetButton");
      const musicButton = document.getElementById("musicButton");
      const phaseList = document.getElementById("phaseList");
      const sprunkiList = document.getElementById("sprunkiList");
      const scene = document.querySelector(".scene");

      const spaceCtx = space.getContext("2d");
      const phaseCtx = phaseMoon.getContext("2d");
      const TAU = Math.PI * 2;
      const STEP = TAU / 16;
      const sprunkiCharacters = [
        { id: "oren", name: "Oren", spokenName: "オレン", file: "sprunki-oren.png", color: "#ff7900", music: "kick", audio: "sounds/oren.wav" },
        { id: "raddy", name: "Raddy", spokenName: "ラディ", file: "sprunki-raddy.png", color: "#f51414", music: "snare", audio: "sounds/raddy.wav" },
        { id: "clukr", name: "Clukr", spokenName: "クルーカー", file: "sprunki-clukr.png", color: "#b9bec4", music: "rideTaiko", audio: "sounds/clukr.wav" },
        { id: "funbot", name: "Fun Bot", spokenName: "ファンボット", file: "sprunki-funbot.png", color: "#ffd33d", music: "amen", audio: "sounds/funbot.wav" },
        { id: "vineria", name: "Vineria", spokenName: "ヴィネリア", file: "sprunki-vineria.png", color: "#58d947", music: "shaker", audio: "sounds/vineria.wav" },
        { id: "gray", name: "Gray", spokenName: "グレー", file: "sprunki-gray.png", color: "#6f737a", music: "bassPulse", audio: "sounds/gray.wav" },
        { id: "brud", name: "brud", spokenName: "ブラッド", file: "sprunki-brud.png", color: "#8b5f33", music: "tomPulse", audio: "sounds/brud.wav" },
        { id: "garnold", name: "Garnold", spokenName: "ガーノルド", file: "sprunki-garnold.png", color: "#d4aa28", music: "synthBell", audio: "sounds/garnold.wav" },
        { id: "owakcx", name: "OWAKCX", spokenName: "オワックス", file: "sprunki-owakcx.png", color: "#78d946", music: "tinyArp", audio: "sounds/owakcx.wav" },
        { id: "sky", name: "Sky", spokenName: "スカイ", file: "sprunki-sky.png", color: "#71c9ff", music: "softClave", audio: "sounds/sky.wav" },
        { id: "mrsun", name: "Mr. Sun", spokenName: "ミスターサン", file: "sprunki-mrsun.png", color: "#ffd94a", music: "sunPiano", audio: "sounds/mrsun.wav" },
        { id: "durple", name: "Durple", spokenName: "ダープル", file: "sprunki-durple.png", color: "#a649ff", music: "hornPulse", audio: "sounds/durple.wav" },
        { id: "mrtree", name: "Mr. Tree", spokenName: "ミスターツリー", file: "sprunki-mrtree.png", color: "#4aa352", music: "treeChord", audio: "sounds/mrtree.wav" },
        { id: "simon", name: "Simon", spokenName: "サイモン", file: "sprunki-simon.png", color: "#ffe054", music: "brightLead", audio: "sounds/simon.wav" },
        { id: "tunner", name: "Tunner", spokenName: "タナー", file: "sprunki-tunner.png", color: "#b89464", music: "whistle", audio: "sounds/tunner.wav" },
        { id: "mrfun", name: "Mr. Fun Computer", displayName: "Mr. Fun", spokenName: "ミスターファンコンピューター", file: "sprunki-mrfun.png", color: "#8fd9ff", music: "brightLead", audio: "sounds/mrfun.wav" },
        { id: "wenda", name: "Wenda", spokenName: "ウェンダ", file: "sprunki-wenda.png", color: "#e9edf2", music: "whistle", audio: "sounds/wenda.wav" },
        { id: "pinki", name: "Pinki", spokenName: "ピンキー", file: "sprunki-pinki.png", color: "#ff9ed5", music: "treeChord", audio: "sounds/pinki.wav" },
        { id: "jevin", name: "Jevin", spokenName: "ジェヴィン", file: "sprunki-jevin.png", color: "#2867c8", music: "hornPulse", audio: "sounds/jevin.wav" },
        { id: "black", name: "Black", spokenName: "ブラック", file: "sprunki-black.png", color: "#111111", music: "bassPulse", audio: "sounds/black.mp3" }
      ];
      let selectedSprunkiIndexes = [0];
      let musicEnabled = true;
      sprunkiCharacters.forEach((character) => {
        character.image = new Image();
        character.image.src = character.file;
        character.image.addEventListener("load", () => draw());
        if (character.audio) {
          character.audioElement = new Audio(character.audio);
          character.audioElement.loop = true;
          character.audioElement.preload = "metadata";
          character.audioElement.volume = 0.82;
        }
      });

      let phase = 0;
      let playing = false;
      let lastTime = 0;
      let animationId = 0;
      let audioContext = null;
      const sprunkiSynthTimers = new Map();
      const activeSprunkiAudios = new Map();
      let sceneHitAreas = null;
      const tapEffects = {
        sun: 0,
        moon: 0,
        earth: 0
      };

      const phaseLabels = [
        { name: "しんげつ", message: "おつきさまが みえにくいよ" },
        { name: "ふつかづき", message: "みぎが すこし ひかるよ" },
        { name: "みかづき", message: "みぎの ほそい おつきさまだよ" },
        { name: "ふくらむ月", message: "みぎが ふくらんできたよ" },
        { name: "じょうげん", message: "みぎはんぶんが ひかるよ" },
        { name: "とおかんや", message: "みぎから まるくなるよ" },
        { name: "じゅうさんや", message: "まんまるに ちかづくよ" },
        { name: "こもちづき", message: "もうすぐ まんげつだよ" },
        { name: "まんげつ", message: "まんまるの おつきさまだよ" },
        { name: "いざよい", message: "みぎから すこし かけるよ" },
        { name: "たちまちづき", message: "ひだりが まるく ひかるよ" },
        { name: "いまちづき", message: "ひだりが ふっくら ひかるよ" },
        { name: "かげん", message: "ひだりはんぶんが ひかるよ" },
        { name: "ありあけ", message: "あさの ひだりの おつきさまだよ" },
        { name: "ほそいありあけ", message: "ひだりの ほそい おつきさまだよ" },
        { name: "みそかづき", message: "しんげつに ちかづくよ" }
      ];

      function resizeCanvas(canvas, context, cssWidth, cssHeight) {
        const ratio = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
        const pixelWidth = Math.round(cssWidth * ratio);
        const pixelHeight = Math.round(cssHeight * ratio);
        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
        }
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function resize() {
        const bounds = scene.getBoundingClientRect();
        resizeCanvas(space, spaceCtx, bounds.width, bounds.height);
        draw();
      }

      function normalizedPhase() {
        return ((phase % TAU) + TAU) % TAU;
      }

      function currentIndex() {
        return Math.round(normalizedPhase() / STEP) % phaseLabels.length;
      }

      function getAudioContext() {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === "suspended") {
          audioContext.resume();
        }
        return audioContext;
      }

      function playTone() {
        try {
          const context = getAudioContext();
          const now = context.currentTime;
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(520 + currentIndex() * 32, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.08, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
          oscillator.connect(gain).connect(context.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.18);
        } catch (error) {
          // Audio is optional; the game remains fully usable without it.
        }
      }

      function stopSprunkiMusic() {
        sprunkiSynthTimers.forEach((timer) => clearInterval(timer));
        sprunkiSynthTimers.clear();
        activeSprunkiAudios.forEach((audio) => {
          audio.pause();
          audio.currentTime = 0;
        });
        activeSprunkiAudios.clear();
      }

      function makeNoiseBuffer(context, duration = 0.08) {
        const buffer = context.createBuffer(1, Math.max(1, Math.floor(context.sampleRate * duration)), context.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < output.length; i += 1) {
          output[i] = Math.random() * 2 - 1;
        }
        return buffer;
      }

      function playPercussion(context, time, kind, volume = 0.12) {
        const gain = context.createGain();
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(volume, time + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + (kind === "kick" ? 0.18 : 0.08));
        gain.connect(context.destination);

        if (kind === "kick") {
          const oscillator = context.createOscillator();
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(150, time);
          oscillator.frequency.exponentialRampToValueAtTime(50, time + 0.16);
          oscillator.connect(gain);
          oscillator.start(time);
          oscillator.stop(time + 0.2);
          return;
        }

        const source = context.createBufferSource();
        const filter = context.createBiquadFilter();
        source.buffer = makeNoiseBuffer(context, kind === "ride" ? 0.12 : 0.07);
        filter.type = "highpass";
        filter.frequency.setValueAtTime(kind === "ride" ? 5200 : 1200, time);
        source.connect(filter).connect(gain);
        source.start(time);
        source.stop(time + (kind === "ride" ? 0.13 : 0.08));
      }

      function playNote(context, time, frequency, duration, type, volume) {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, time);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(volume, time + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
        oscillator.connect(gain).connect(context.destination);
        oscillator.start(time);
        oscillator.stop(time + duration + 0.03);
      }

      function playSprunkiBar(context, character, step) {
        const now = context.currentTime + 0.015;
        const beat = step % 8;
        if (character.music === "kick") {
          if (beat === 0 || beat === 2 || beat === 4 || beat === 6) playPercussion(context, now, "kick", 0.15);
        } else if (character.music === "snare") {
          if (beat === 1 || beat === 3 || beat === 5 || beat === 7) playPercussion(context, now, "hat", 0.13);
          if (beat === 2 || beat === 6) playPercussion(context, now + 0.035, "hat", 0.08);
        } else if (character.music === "rideTaiko") {
          playPercussion(context, now, "ride", beat % 2 === 0 ? 0.075 : 0.045);
          if (beat === 0 || beat === 4) playNote(context, now, 164.81, 0.12, "sine", 0.075);
        } else if (character.music === "amen") {
          if (beat === 0 || beat === 3 || beat === 5) playPercussion(context, now, "kick", 0.11);
          if (beat === 2 || beat === 6) playPercussion(context, now, "hat", 0.12);
          if (beat === 7) playPercussion(context, now, "ride", 0.08);
        } else if (character.music === "shaker") {
          playPercussion(context, now, beat % 2 === 0 ? "hat" : "ride", beat % 2 === 0 ? 0.07 : 0.04);
        } else if (character.music === "bassPulse") {
          const bass = [73.42, 73.42, 92.5, 73.42, 110, 92.5, 73.42, 55];
          playNote(context, now, bass[beat], 0.18, "sawtooth", 0.07);
        } else if (character.music === "tomPulse") {
          if (beat === 0 || beat === 3 || beat === 6) playNote(context, now, beat === 3 ? 196 : 146.83, 0.12, "sine", 0.09);
          if (beat === 4) playPercussion(context, now, "kick", 0.08);
        } else if (character.music === "synthBell") {
          const bell = [523.25, 659.25, 783.99, 659.25, 880, 783.99, 659.25, 587.33];
          if (beat % 2 === 0) playNote(context, now, bell[beat], 0.16, "triangle", 0.075);
        } else if (character.music === "tinyArp") {
          const arp = [440, 554.37, 659.25, 830.61, 659.25, 554.37, 493.88, 369.99];
          playNote(context, now, arp[beat], 0.09, "square", 0.045);
        } else if (character.music === "softClave") {
          if (beat === 0 || beat === 2 || beat === 5 || beat === 7) playNote(context, now, 1174.66, 0.045, "triangle", 0.06);
          if (beat === 4) playNote(context, now, 880, 0.06, "triangle", 0.05);
        } else if (character.music === "sunPiano") {
          const chord = [523.25, 659.25, 783.99, 1046.5];

        } else if (character.music === "hornPulse") {
          if (beat === 0 || beat === 4) playNote(context, now, 196, 0.2, "sawtooth", 0.075);
          if (beat === 2 || beat === 6) playNote(context, now, 246.94, 0.14, "sawtooth", 0.055);
        } else if (character.music === "treeChord") {

            playNote(context, now, 261.63, 0.2, "triangle", 0.04);
            playNote(context, now, 329.63, 0.2, "triangle", 0.035);
          }

          playNote(context, now, lead[beat], 0.1, "square", 0.045);
        } else if (character.music === "whistle") {
          if (beat === 1 || beat === 5) playNote(context, now, 1318.51, 0.16, "sine", 0.055);
          if (beat === 3 || beat === 7) playNote(context, now, 1174.66, 0.12, "sine", 0.045);
        }
      }

      function playSprunkiMusic(index) {
        if (!musicEnabled) return;
        try {
          const character = sprunkiCharacters[index];
          if (character.audioElement) {
            const audio = character.audioElement;
            if (activeSprunkiAudios.has(character.id)) {
              audio.currentTime = 0;
              return;
            }
            audio.currentTime = 0;
            activeSprunkiAudios.set(character.id, audio);
            const playPromise = audio.play();
            if (playPromise && typeof playPromise.catch === "function") {
              playPromise.catch(() => {
                activeSprunkiAudios.delete(character.id);
                playSynthSprunkiMusic(character);
              });
            }
            return;
          }
          playSynthSprunkiMusic(character);
        } catch (error) {
          // Character music is optional; all visual play still works without audio.
        }
      }

      function playSynthSprunkiMusic(character) {
        try {
          if (sprunkiSynthTimers.has(character.id)) return;
          const context = getAudioContext();
          let step = 0;
          playSprunkiBar(context, character, step);
          const timer = setInterval(() => {
            step += 1;
            playSprunkiBar(context, character, step);
          }, 240);
          sprunkiSynthTimers.set(character.id, timer);
        } catch (error) {
          // Character music is optional; all visual play still works without audio.
        }
      }

      function stopOneSprunkiMusic(character) {
        const timer = sprunkiSynthTimers.get(character.id);
        if (timer) {
          clearInterval(timer);
          sprunkiSynthTimers.delete(character.id);
        }
        const audio = activeSprunkiAudios.get(character.id);
        if (audio) {
          audio.pause();
          audio.currentTime = 0;
          activeSprunkiAudios.delete(character.id);
        }
      }

      function restartSelectedSprunkiMusic() {
        if (!musicEnabled) return;
        stopSprunkiMusic();
        selectedSprunkiIndexes.forEach((index) => playSprunkiMusic(index));
      }

      const moonMarks = [
        { x: -0.34, y: -0.22, r: 0.18, type: "mare" },
        { x: 0.12, y: -0.28, r: 0.22, type: "mare" },
        { x: 0.32, y: 0.16, r: 0.19, type: "mare" },
        { x: -0.08, y: 0.34, r: 0.15, type: "mare" },
        { x: -0.42, y: 0.18, r: 0.08, type: "crater" },
        { x: -0.15, y: -0.48, r: 0.07, type: "crater" },
        { x: 0.03, y: 0.08, r: 0.09, type: "crater" },
        { x: 0.38, y: -0.12, r: 0.07, type: "crater" },

      function moonTexture(nx, ny) {
        let value = 0.74;
        value += Math.sin((nx * 14.1 + ny * 7.4) * Math.PI) * 0.035;
        value += Math.sin((nx * 29.7 - ny * 18.2) * Math.PI) * 0.022;
        value += Math.sin((nx * 53.3 + ny * 41.9) * Math.PI) * 0.012;

        for (const mark of moonMarks) {
          const dx = nx - mark.x;
          const dy = ny - mark.y;
          const d = Math.hypot(dx, dy);
          if (d >= mark.r) continue;
          const falloff = 1 - d / mark.r;
          if (mark.type === "mare") {
            value -= 0.16 * falloff;
          } else {
            value -= 0.18 * Math.max(0, 1 - d / (mark.r * 0.72));
            value += 0.08 * Math.max(0, 1 - Math.abs(d - mark.r * 0.72) / (mark.r * 0.22));
          }
        }

        return Math.max(0.38, Math.min(0.92, value));
      }

      function drawLitMoon(ctx, cx, cy, radius, lightX, lightY, lightZ) {
        const diameter = radius * 2;
        const moonBuffer = document.createElement("canvas");
        moonBuffer.width = diameter;
        moonBuffer.height = diameter;
        const moonBufferCtx = moonBuffer.getContext("2d");
        const image = moonBufferCtx.createImageData(diameter, diameter);
        const data = image.data;
        const lightLength = Math.hypot(lightX, lightY, lightZ) || 1;
        const lx = lightX / lightLength;
        const ly = lightY / lightLength;
        const lz = lightZ / lightLength;

        for (let py = 0; py < diameter; py += 1) {
          for (let px = 0; px < diameter; px += 1) {
            const nx = (px + 0.5 - radius) / radius;
            const ny = (py + 0.5 - radius) / radius;
            const distance = nx * nx + ny * ny;
            const offset = (py * diameter + px) * 4;
            if (distance > 1) {
              data[offset + 3] = 0;
              continue;
            }

            const nz = Math.sqrt(1 - distance);
            const light = nx * lx + ny * ly + nz * lz;
            const rim = 1 - Math.sqrt(distance);
            const shade = Math.max(0, light);
            const surface = moonTexture(nx, ny);

            if (shade > 0) {
              const glow = 0.42 + 0.68 * shade + 0.08 * rim;
              data[offset] = Math.round(214 * surface * glow + 42);
              data[offset + 1] = Math.round(207 * surface * glow + 39);
              data[offset + 2] = Math.round(187 * surface * glow + 34);
              data[offset + 3] = 255;
            } else {
              data[offset] = Math.round(28 + 28 * surface * rim);
              data[offset + 1] = Math.round(32 + 28 * surface * rim);
              data[offset + 2] = Math.round(43 + 34 * surface * rim);
              data[offset + 3] = 255;
            }
          }
        }

        moonBufferCtx.putImageData(image, 0, 0);
        ctx.save();
        ctx.drawImage(moonBuffer, cx - radius, cy - radius, diameter, diameter);
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, TAU);
        ctx.strokeStyle = "rgba(255, 248, 223, 0.3)";
        ctx.lineWidth = Math.max(1, radius * 0.025);
        ctx.stroke();
        ctx.restore();
      }

      function drawMoonPhase(ctx, cx, cy, radius, phaseValue, scaleForCraters) {
        drawLitMoon(
          ctx,
          cx,
          cy,
          radius,
          Math.sin(phaseValue),
          0,
          -Math.cos(phaseValue)
        );
      }

      function drawMoonFromAbove(ctx, cx, cy, radius) {

      }

      function drawSprunkiSpriteOnEarth(ctx, earthX, earthY, earthRadius) {
        const dance = tapEffects.earth;
        const bob = dance > 0 ? Math.sin(performance.now() * 0.026) * earthRadius * 0.08 * dance : 0;
        const selected = selectedSprunkiIndexes
          .map((index) => sprunkiCharacters[index])
          .filter((character) => character.image.complete && character.image.naturalWidth);

        if (!selected.length) {
          drawSprunkiOnEarth(ctx, earthX, earthY, earthRadius);
          return;
        }

        const count = selected.length;
        const columns = Math.min(count, count <= 2 ? count : 4);
        const rows = Math.ceil(count / columns);
        const spriteHeight = earthRadius * Math.max(0.92, Math.min(2.45, 3.0 / Math.max(columns, rows)));
        const gap = earthRadius * 0.12;
        const rowHeight = spriteHeight * 0.58;
        const startY = earthY - earthRadius * (0.78 + Math.max(0, rows - 1) * 0.14) + bob;

        ctx.save();
        if (dance > 0) {
          ctx.strokeStyle = `rgba(255, 241, 120, ${0.62 * dance})`;
          ctx.lineWidth = Math.max(1.2, earthRadius * 0.035);
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(earthX - earthRadius * 0.78, earthY - earthRadius * 0.62);
          ctx.lineTo(earthX - earthRadius * 0.98, earthY - earthRadius * 0.84);
          ctx.lineTo(earthX - earthRadius * 0.78, earthY - earthRadius * 1.04);
          ctx.moveTo(earthX + earthRadius * 0.78, earthY - earthRadius * 0.62);
          ctx.lineTo(earthX + earthRadius * 0.98, earthY - earthRadius * 0.84);
          ctx.lineTo(earthX + earthRadius * 0.78, earthY - earthRadius * 1.04);
          ctx.stroke();
        }
        selected.forEach((character, order) => {
          const sprite = character.image;
          const row = Math.floor(order / columns);
          const col = order % columns;
          const itemsInRow = row === rows - 1 ? count - row * columns : columns;
          const imageRatio = sprite.naturalWidth / sprite.naturalHeight;
          const spriteWidth = spriteHeight * imageRatio;
          const totalRowWidth = itemsInRow * spriteHeight * 0.52 + Math.max(0, itemsInRow - 1) * gap;
          const centerOffset = (col - (itemsInRow - 1) / 2) * (totalRowWidth / Math.max(1, itemsInRow));
          const x = earthX + centerOffset - spriteWidth / 2;
          const y = startY + row * rowHeight - spriteHeight * 0.54;
          ctx.drawImage(sprite, x, y, spriteWidth, spriteHeight);
        });
        ctx.restore();
      }

        const darkOrange = "#d95a00";
        const peach = "#ffc08b";
        const black = "#101010";

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (dance > 0) {

          ctx.moveTo(earthX - earthRadius * 0.78, earthY - earthRadius * 0.62);

        ctx.strokeStyle = peach;

        ctx.beginPath();

        ctx.strokeStyle = black;
        ctx.fillStyle = peach;
        ctx.lineWidth = Math.max(2.1, earthRadius * 0.06);
        const padW = headR * 0.36;
        const padH = headR * 0.86;
        ctx.beginPath();
        ctx.rect(headX - headR * 1.08, headY - padH * 0.5, padW, padH);
        ctx.rect(headX + headR * 0.72, headY - padH * 0.5, padW, padH);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = orange;
        ctx.beginPath();
        ctx.ellipse(headX - headR * 1.22, headY, headR * 0.25, headR * 0.43, 0, -Math.PI / 2, Math.PI / 2);
        ctx.ellipse(headX + headR * 1.22, headY, headR * 0.25, headR * 0.43, 0, Math.PI / 2, Math.PI * 1.5);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = black;
        ctx.lineWidth = Math.max(1.7, earthRadius * 0.045);
        ctx.beginPath();
        ctx.moveTo(headX - headR * 0.34, headY - headR * 0.78);
        ctx.lineTo(headX - headR * 0.07, headY - headR * 0.45);
        ctx.lineTo(headX + headR * 0.06, headY - headR * 0.78);

        ctx.lineTo(headX + headR * 0.28, headY - headR * 0.76);

        ctx.lineWidth = Math.max(1.15, earthRadius * 0.033);

        ctx.stroke();

        function drawHalfEye(x) {
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(x, headY + headR * 0.04, headR * 0.32, headR * 0.21, 0, 0, TAU);
          ctx.clip();
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x - headR * 0.36, headY - headR * 0.03, headR * 0.72, headR * 0.35);
          ctx.fillStyle = "#050505";

        drawHalfEye(headX - headR * 0.35);
        drawHalfEye(headX + headR * 0.35);

        ctx.strokeStyle = black;

      function drawScene() {
        const w = space.clientWidth;
        const h = space.clientHeight;
        const ctx = spaceCtx;
        ctx.clearRect(0, 0, w, h);

        const centerX = w * 0.58;
        const centerY = h * 0.52;
        const orbitRadius = Math.min(w * 0.26, h * 0.32);
        const earthRadius = Math.max(28, Math.min(w, h) * 0.105);
        const moonRadius = Math.max(14, Math.min(w, h) * 0.052);
        const sunX = Math.max(42, w * 0.11);
        const sunY = centerY;
        const sunRadius = Math.max(22, Math.min(w, h) * 0.075);
        const p = normalizedPhase();
        const moonX = centerX - Math.cos(p) * orbitRadius;
        const moonY = centerY - Math.sin(p) * orbitRadius;
        const sunTap = tapEffects.sun;
        const moonTap = tapEffects.moon;
        const moonDrawRadius = Math.round(moonRadius * (1 + 0.2 * moonTap));
        sceneHitAreas = {
          sun: { x: sunX, y: sunY, r: sunRadius * 1.65 },
          earth: { x: centerX, y: centerY, r: earthRadius * 1.28 },
          moon: { x: moonX, y: moonY, r: moonRadius * 1.8 }
        };

        ctx.save();
        ctx.globalAlpha = 0.9;
        for (let i = 0; i < 20; i += 1) {
          const x = (i * 83 + 31) % w;
          const y = (i * 47 + 23) % h;
          ctx.beginPath();
          ctx.arc(x, y, i % 4 === 0 ? 1.4 : 0.9, 0, TAU);
          ctx.fillStyle = "rgba(255, 248, 223, 0.54)";
          ctx.fill();
        }
        ctx.restore();

        const sunGradient = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, sunRadius * 1.55);
        sunGradient.addColorStop(0, "#fff4a6");
        sunGradient.addColorStop(0.58, "#ffd568");
        sunGradient.addColorStop(1, "rgba(255, 156, 69, 0)");
        ctx.fillStyle = sunGradient;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius * (1.55 + 0.55 * sunTap), 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius * (1 + 0.08 * sunTap), 0, TAU);
        ctx.fillStyle = "#ffd568";
        ctx.fill();
        if (sunTap > 0) {
          ctx.save();
          ctx.strokeStyle = `rgba(255, 242, 164, ${0.75 * sunTap})`;
          ctx.lineWidth = Math.max(2, sunRadius * 0.12);
          for (let i = 0; i < 12; i += 1) {
            const a = (TAU / 12) * i + performance.now() * 0.004;
            const inner = sunRadius * 1.22;
            const outer = sunRadius * (1.68 + 0.25 * sunTap);
            ctx.beginPath();
            ctx.moveTo(sunX + Math.cos(a) * inner, sunY + Math.sin(a) * inner);
            ctx.lineTo(sunX + Math.cos(a) * outer, sunY + Math.sin(a) * outer);
            ctx.stroke();
          }
          ctx.restore();
        }

        ctx.save();
        const beamStart = sunX + sunRadius * 0.78;
        const beamEnd = centerX + earthRadius * 1.25;
        const beamTop = centerY - earthRadius * 0.92;
        const beamBottom = centerY + earthRadius * 0.92;
        const beamGradient = ctx.createLinearGradient(beamStart, centerY, beamEnd, centerY);
        beamGradient.addColorStop(0, "rgba(255, 226, 121, 0.28)");
        beamGradient.addColorStop(0.55, "rgba(255, 226, 121, 0.16)");
        beamGradient.addColorStop(1, "rgba(255, 226, 121, 0.03)");
        ctx.fillStyle = beamGradient;
        ctx.beginPath();
        ctx.moveTo(beamStart, beamTop);
        ctx.lineTo(beamEnd, centerY - earthRadius * 0.56);
        ctx.lineTo(beamEnd, centerY + earthRadius * 0.56);
        ctx.lineTo(beamStart, beamBottom);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(255, 226, 121, 0.42)";
        ctx.lineWidth = Math.max(1.5, earthRadius * 0.045);
        ctx.setLineDash([10, 9]);
        ctx.beginPath();
        ctx.moveTo(beamStart, centerY - earthRadius * 0.55);
        ctx.lineTo(beamEnd, centerY - earthRadius * 0.33);
        ctx.moveTo(beamStart, centerY);
        ctx.lineTo(beamEnd, centerY);
        ctx.moveTo(beamStart, centerY + earthRadius * 0.55);
        ctx.lineTo(beamEnd, centerY + earthRadius * 0.33);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = "rgba(255, 248, 223, 0.28)";
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 8]);
        ctx.beginPath();
        ctx.arc(centerX, centerY, orbitRadius, 0, TAU);
        ctx.stroke();
        ctx.restore();

        const earthGradient = ctx.createRadialGradient(centerX - earthRadius * 0.35, centerY - earthRadius * 0.45, 2, centerX, centerY, earthRadius);
        earthGradient.addColorStop(0, "#b3f4f0");
        earthGradient.addColorStop(0.72, "#68c7c2");
        earthGradient.addColorStop(1, "#3e879f");
        ctx.beginPath();
        ctx.arc(centerX, centerY, earthRadius, 0, TAU);
        ctx.fillStyle = earthGradient;
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "#7dd77b";
        ctx.beginPath();
        ctx.ellipse(centerX - earthRadius * 0.18, centerY - earthRadius * 0.08, earthRadius * 0.32, earthRadius * 0.2, -0.5, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(centerX + earthRadius * 0.24, centerY + earthRadius * 0.18, earthRadius * 0.28, earthRadius * 0.16, 0.35, 0, TAU);
        ctx.fill();
        ctx.restore();
        ctx.beginPath();
        ctx.arc(centerX, centerY, earthRadius, 0, TAU);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.36)";
        ctx.lineWidth = 2;
        ctx.stroke();
        drawSprunkiSpriteOnEarth(ctx, centerX, centerY, earthRadius);

        if (moonTap > 0) {
          ctx.save();
          ctx.fillStyle = `rgba(255, 244, 168, ${0.78 * moonTap})`;
          for (let i = 0; i < 6; i += 1) {
            const a = (TAU / 6) * i + performance.now() * 0.006;
            const sx = moonX + Math.cos(a) * moonRadius * 2.05;
            const sy = moonY + Math.sin(a) * moonRadius * 2.05;
            ctx.beginPath();
            ctx.moveTo(sx, sy - moonRadius * 0.18);
            ctx.lineTo(sx + moonRadius * 0.08, sy);
            ctx.lineTo(sx, sy + moonRadius * 0.18);
            ctx.lineTo(sx - moonRadius * 0.08, sy);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        }
        drawMoonFromAbove(ctx, moonX, moonY, moonDrawRadius);
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonDrawRadius + 6, 0, TAU);
        ctx.strokeStyle = "rgba(255, 248, 223, 0.18)";
        ctx.lineWidth = 3;
        ctx.stroke();

      }

      function drawLargePhase() {
        const rect = phaseMoon.getBoundingClientRect();
        const cssSize = Math.max(96, rect.width || 120);
        resizeCanvas(phaseMoon, phaseCtx, cssSize, cssSize);
        phaseCtx.clearRect(0, 0, cssSize, cssSize);
        drawMoonPhase(phaseCtx, cssSize / 2, cssSize / 2, Math.round(cssSize * 0.42), normalizedPhase(), 1.4);
      }

      function updateText() {
        const index = currentIndex();
        const label = phaseLabels[index];
        phaseName.textContent = label.name;
        phaseMessage.textContent = label.message;
        phaseList.querySelectorAll(".phase-choice").forEach((button, buttonIndex) => {
          button.classList.toggle("is-active", buttonIndex === index);
          button.setAttribute("aria-pressed", buttonIndex === index ? "true" : "false");
        });
      }

      function buildPhasePicker() {
        phaseList.innerHTML = "";
        phaseLabels.forEach((label, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "phase-choice";
          button.textContent = label.name;
          button.setAttribute("aria-label", `${label.name}を表示`);
          button.addEventListener("click", () => {
            playTone();
            speakJapanese(label.name);
            setPlaying(false);
            snapPhase(index * STEP);
            draw();
          });
          phaseList.appendChild(button);
        });
      }

      function buildSprunkiPicker() {
        sprunkiList.innerHTML = "";
        sprunkiCharacters.forEach((character, index) => {
          const button = document.createElement("button");
          const dot = document.createElement("span");
          const label = document.createElement("span");
          button.type = "button";
          button.className = "sprunki-choice";
          button.setAttribute("aria-label", `${character.name}にする`);
          dot.className = "sprunki-dot";
          dot.style.background = character.color;
          label.textContent = character.displayName || character.name;
          button.append(dot, label);
          button.addEventListener("click", () => {
            const selectedPosition = selectedSprunkiIndexes.indexOf(index);
            if (selectedPosition >= 0 && selectedSprunkiIndexes.length > 1) {
              selectedSprunkiIndexes.splice(selectedPosition, 1);
              stopOneSprunkiMusic(character);
            } else if (selectedPosition < 0) {
              selectedSprunkiIndexes.push(index);
              playSprunkiMusic(index);
            } else {
              playSprunkiMusic(index);
            }
            speakEnglish(character.name);
            triggerTapEffect("earth");
            updateSprunkiPicker();
            draw();
          });
          sprunkiList.appendChild(button);
        });
        updateSprunkiPicker();
      }

      function updateSprunkiPicker() {
        sprunkiList.querySelectorAll(".sprunki-choice").forEach((button, index) => {
          const isActive = selectedSprunkiIndexes.includes(index);
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
      }

      function draw() {
        drawScene();
        drawLargePhase();
        updateText();
      }

      function setPlaying(next) {
        playing = next;
        playButton.innerHTML = playing
          ? '<span class="button-icon" aria-hidden="true">⏸</span>とまる'
          : '<span class="button-icon" aria-hidden="true">▶</span>うごく';
        playButton.setAttribute("aria-label", playing ? "停止する" : "再生する");
        if (playing) {
          lastTime = performance.now();
          animationId = requestAnimationFrame(tick);
        } else {
          cancelAnimationFrame(animationId);
        }
      }

      function tick(time) {
        const delta = Math.min(48, time - lastTime);
        lastTime = time;
        phase += delta * 0.00055;
        draw();
        if (playing) {
          animationId = requestAnimationFrame(tick);
        }
      }

      function snapPhase(value) {
        phase = ((value % TAU) + TAU) % TAU;
      }

      function triggerTapEffect(kind) {
        tapEffects[kind] = 1;
        const startedAt = performance.now();

        function fade(now) {
          const progress = Math.min(1, (now - startedAt) / 760);
          tapEffects[kind] = 1 - progress;
          draw();
          if (progress < 1) requestAnimationFrame(fade);
        }

        requestAnimationFrame(fade);
      }

      function handleSceneTap(event) {
        if (!sceneHitAreas) return;
        const rect = space.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const hits = ["sun", "moon", "earth"];
        const hit = hits.find((kind) => {
          const area = sceneHitAreas[kind];
          return Math.hypot(x - area.x, y - area.y) <= area.r;
        });

        if (!hit) return;
        playTone();
        if (hit === "moon") {
          setPlaying(false);
          snapPhase(Math.round((phase + STEP) / STEP) * STEP);
          speakJapanese(phaseLabels[currentIndex()].name);
        } else if (hit === "earth") {
          restartSelectedSprunkiMusic();
        }
        triggerTapEffect(hit);
        draw();
      }

      playButton.addEventListener("click", () => {
        playTone();
        setPlaying(!playing);
      });

      stepButton.addEventListener("click", () => {
        playTone();
        setPlaying(false);
        snapPhase(Math.round((phase + STEP) / STEP) * STEP);
        speakJapanese(phaseLabels[currentIndex()].name);
        draw();
      });

      resetButton.addEventListener("click", () => {
        playTone();
        setPlaying(false);
        snapPhase(0);
        speakJapanese(phaseLabels[0].name);
        draw();
      });

      musicButton.addEventListener("click", () => {
        musicEnabled = !musicEnabled;
        if (musicEnabled) {
          playTone();
          restartSelectedSprunkiMusic();
        } else {
          stopSprunkiMusic();
        }
        updateMusicButton();
      });

      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("orientationchange", () => setTimeout(resize, 150), { passive: true });
      space.addEventListener("click", handleSceneTap);

      buildPhasePicker();
      buildSprunkiPicker();
      updateMusicButton();
      resize();
    })();
  </script>
</body>
</html>
