<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="おつきさま">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101719">
  <title>おつきさまのかたち</title>
  <style>
    :root {
      color-scheme: dark;
      --sky: #101719; --ink: #f5faf7; --muted: #a5b7b3; --line: #344640;
      --button: #b9edcc; --button-ink: #14271f;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; letter-spacing: 0; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--sky); color: var(--ink); }
    body { padding: max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom)); }
    main {
      width: min(100%, 1160px); height: calc(100svh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      min-height: 550px; margin: auto; display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(360px, 1fr);
      grid-template-rows: minmax(0, 1fr) 300px 64px; gap: 16px 32px;
    }
    button, a { touch-action: manipulation; }
    button, .game-link {
      font: inherit; color: inherit; cursor: pointer; appearance: none; text-decoration: none;
      border: 1px solid var(--line); background: #1a2925; border-radius: 8px;
    }
    button { min-width: 0; }
    button:disabled { opacity: 0.45; cursor: default; }
    button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid #f9ce6b; outline-offset: 3px; }
    button:active, .game-link:active { transform: translateY(1px); }
    .scene { position: relative; grid-column: 1; grid-row: 1 / 3; min-height: 0; overflow: hidden; }
    #space { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #space:active { cursor: grabbing; }
    .scene-actions { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; justify-content: space-between; pointer-events: none; }
    .scene-actions button { pointer-events: auto; width: 44px; height: 44px; font-size: 22px; background: #18221fd9; }
    .progress-dots { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; }
    .progress-dots i { width: 5px; height: 5px; border-radius: 50%; background: #64746e; }
    .progress-dots i.active { background: #f9ce6b; box-shadow: 0 0 0 3px #f9ce6b22; }
    .phase-strip { grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: 20px; padding: 8px 0; cursor: pointer; min-width: 0; }
    #phaseMoon { width: 144px; height: 144px; flex: 0 0 auto; }
    .phase-copy { min-width: 0; }
    .small-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .phase-name { font-size: 27px; font-weight: 800; line-height: 1.4; overflow-wrap: anywhere; }
    .phase-message { font-size: 13px; line-height: 1.6; color: #c4d5cd; margin-top: 8px; }
    .library { grid-column: 2; grid-row: 2; min-width: 0; display: grid; grid-template-rows: 40px minmax(0, 1fr); gap: 12px; }
    .library-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; border-bottom: 1px solid var(--line); }
    .library-tabs button { border: 0; border-radius: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; padding: 0 2px; }
    .library-tabs button[aria-selected="true"] { color: #b9edcc; border-bottom: 3px solid #b9edcc; }
    .phase-picker { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 5px; }
    .phase-choice { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 2px; font-size: 11px; line-height: 1.25; }
    .phase-choice canvas { width: 26px; height: 26px; }
    .phase-choice.is-active { background: #b9edcc; color: #14271f; border-color: #b9edcc; }
    .sprunki-picker { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 4px; }
    .sprunki-choice { position: relative; min-height: 0; padding: 2px; font-size: 9px; line-height: 1.1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .sprunki-choice img { width: 28px; height: 29px; object-fit: contain; }
    .sprunki-choice span { max-width: 100%; overflow-wrap: anywhere; }
    .sprunki-choice.is-active { border-color: #b9edcc; background: #284338; }
    .sprunki-choice.is-active::after { content: "✓"; position: absolute; top: 1px; right: 3px; color: #b9edcc; font-size: 10px; }
    [hidden] { display: none !important; }
    .controls { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) repeat(2, 64px); gap: 8px; align-items: stretch; }
    .controls button, .game-link { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; min-height: 48px; }
    #playButton { background: #b9edcc; color: #14271f; border-color: #b9edcc; }
    #musicButton[aria-pressed="true"] { background: #493b22; color: #ffda80; border-color: #a08242; }
    .button-icon { font-size: 21px; line-height: 1; }
    .game-link { font-size: 9px; text-align: center; }
    .game-link .button-icon { display: block; font-size: 16px; margin-bottom: 3px; }
    .quiz { display: grid; grid-template-rows: 44px minmax(88px, 1fr) 44px; gap: 4px; min-height: 0; }
    .quiz-prompt { border: 0; background: transparent; font-size: 16px; line-height: 1.3; font-weight: 800; color: #ffda80; padding: 0 2px; }
    .quiz-options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 4px; }
    .quiz-options button { display: grid; place-items: center; min-height: 42px; padding: 0; overflow: hidden; }
    .quiz-options canvas { width: 40px; height: 40px; }
    .quiz-options .correct { border-color: #b9edcc; background: #365c48; }
    .quiz-options .try-again { border-color: #f4b183; }
    .quiz-footer { display: grid; grid-template-columns: minmax(0, 1fr) 82px; gap: 8px; align-items: center; }
    .quiz-result { text-align: center; font-size: 13px; line-height: 1.3; white-space: pre-line; color: #ffda80; }
    #quizNext { height: 44px; font-size: 14px; }
    .quiz-mask { display: none; width: 144px; height: 144px; flex: 0 0 auto; place-items: center; font: 48px/1 Arial, sans-serif; color: #ffda80; }
    .phase-strip.is-masked #phaseMoon { display: none; }
    .phase-strip.is-masked .quiz-mask { display: grid; }
    body.in-quiz .phase-name { font-size: 18px; }
    .audio-status { position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%); z-index: 3; background: #492f22; color: white; padding: 8px 16px; border-radius: 8px; font-size: 13px; max-width: 90%; }
    @media (max-width: 759px) {
      main { width: min(100%, 500px); grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(165px, 1fr) 94px 266px 54px; gap: 8px; }
      .scene { grid-column: 1; grid-row: 1; }
      .phase-strip { grid-column: 1; grid-row: 2; gap: 14px; padding: 0 8px; }
      #phaseMoon { width: 90px; height: 90px; }
      .quiz-mask { width: 90px; height: 90px; }
      .phase-name { font-size: 25px; }
      .phase-message { margin-top: 2px; font-size: 12px; }
      .small-label { font-size: 11px; margin-bottom: 2px; }
      .library { grid-column: 1; grid-row: 3; grid-template-rows: 36px minmax(0, 1fr); gap: 8px; }
      .controls { grid-column: 1; grid-row: 4; grid-template-columns: repeat(4, minmax(0, 1fr)) repeat(2, 46px); gap: 5px; }
      .controls button { flex-direction: column; gap: 3px; font-size: 11px; }
      .controls .button-icon { font-size: 19px; }
    }
    @media (max-width: 759px) and (max-height: 700px) {
      body { padding: max(4px, env(safe-area-inset-top)) 8px max(4px, env(safe-area-inset-bottom)); }
      main { min-height: 540px; height: calc(100svh - 8px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); grid-template-rows: minmax(144px, 1fr) 76px 256px 48px; gap: 5px; }
      #phaseMoon { width: 74px; height: 74px; }
      .quiz-mask { width: 74px; height: 74px; }
      .phase-name { font-size: 22px; }
      .phase-message { font-size: 11px; }
      .library { gap: 5px; grid-template-rows: 31px minmax(0, 1fr); }
      .sprunki-choice img { width: 25px; height: 25px; }
      .phase-choice canvas { width: 23px; height: 23px; }
    }
    @media (min-width: 760px) and (max-height: 650px) {
      main { min-height: 350px; grid-template-rows: minmax(80px, 1fr) 210px 48px; gap: 8px 20px; }
      #phaseMoon { width: 90px; height: 90px; }
      .quiz-mask { width: 90px; height: 90px; }
      .library { grid-template-rows: 22px minmax(0, 1fr); gap: 4px; }
    }
    @media (min-width: 560px) and (max-height: 500px) {
      body { padding: max(4px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
      main { width: 100%; min-height: 342px; height: calc(100svh - 8px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); grid-template-columns: minmax(0, 1fr) minmax(280px, 1fr); grid-template-rows: minmax(68px, 1fr) 210px 48px; gap: 8px 12px; }
      .scene { grid-column: 1; grid-row: 1 / 3; }
      .phase-strip { grid-column: 2; grid-row: 1; gap: 8px; padding: 0; }
      #phaseMoon, .quiz-mask { width: 64px; height: 64px; }
      .phase-name { font-size: 18px; }
      .small-label { margin-bottom: 0; font-size: 10px; }
      .phase-message { margin-top: 0; font-size: 11px; }
      .library { grid-column: 2; grid-row: 2; grid-template-rows: 22px minmax(0, 1fr); gap: 4px; }
      .controls { grid-column: 1 / -1; grid-row: 3; grid-template-columns: repeat(4, minmax(0, 1fr)) repeat(2, 46px); }
      .controls button { flex-direction: row; gap: 6px; font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main aria-label="月の満ち欠けをみるゲーム">
    <section class="scene" aria-label="太陽、地球、月の動き">
      <canvas id="space" role="slider" tabindex="0" aria-label="月の位置" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0"></canvas>
      <div class="scene-actions">
        <button id="voiceButton" type="button" aria-label="読み上げをオフにする" aria-pressed="true" title="読み上げ">♬</button>
        <button id="fullscreenButton" type="button" aria-label="全画面表示" title="全画面表示">⛶</button>
      </div>
      <div class="progress-dots" id="progressDots" aria-hidden="true"></div>
    </section>

    <section class="phase-strip" id="phaseSummary" aria-live="polite" role="button" tabindex="0">
      <canvas id="phaseMoon" width="240" height="240" aria-label="地球から見える月"></canvas>
      <div class="quiz-mask" aria-hidden="true">?</div>
      <div class="phase-copy">
        <div class="small-label">ちきゅうから みえる</div>
        <div class="phase-name" id="phaseName">しんげつ</div>
        <div class="phase-message" id="phaseMessage">おつきさまが みえにくいよ</div>
      </div>
    </section>

    <section class="library" aria-label="えらんであそぶ">
      <div class="library-tabs" role="tablist" aria-label="あそび">
        <button id="tabMoon" role="tab" aria-selected="true" aria-controls="phaseList" data-panel="phaseList">おつきさま</button>
        <button id="tabFriends" role="tab" aria-selected="false" aria-controls="sprunkiList" data-panel="sprunkiList" tabindex="-1">なかま</button>
        <button id="tabQuiz" role="tab" aria-selected="false" aria-controls="quizPanel" data-panel="quizPanel" data-quiz-mode="current" tabindex="-1">みつけて</button>
        <button id="tabChallenge" role="tab" aria-selected="false" aria-controls="quizPanel" data-panel="quizPanel" data-quiz-mode="future" tabindex="-1">チャレンジ</button>
      </div>
      <section class="phase-picker" id="phaseList" role="tabpanel" aria-labelledby="tabMoon"></section>
      <section class="sprunki-picker" id="sprunkiList" role="tabpanel" aria-labelledby="tabFriends" hidden></section>
      <section class="quiz" id="quizPanel" role="tabpanel" aria-labelledby="tabQuiz" hidden>
        <button class="quiz-prompt" id="quizPrompt" title="もういちど聞く"></button>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-footer">
          <div class="quiz-result" id="quizResult" role="status"></div>
          <button id="quizNext" type="button" disabled>つぎへ →</button>
        </div>
      </section>
    </section>
    <div class="audio-status" id="audioStatus" role="status" hidden></div>

    <nav class="controls" aria-label="ゲームのそうさ">
      <button id="playButton" type="button" aria-label="再生する">
        <span class="button-icon" aria-hidden="true">▶</span>
        うごく
      </button>
      <button id="stepButton" type="button" aria-label="ひとつ進む">
        <span class="button-icon" aria-hidden="true">➜</span>
        すすむ
      </button>
      <button id="resetButton" type="button" aria-label="最初に戻る">
        <span class="button-icon" aria-hidden="true">↺</span>
        もどる
      </button>
      <button id="musicButton" type="button" aria-label="音楽を鳴らす">
        <span class="button-icon" aria-hidden="true">♪</span>
        おと
      </button>
      <a class="game-link" href="index.html?game=piano" target="_top" aria-label="Switch to Sprunki piano rhythm game">
        <span><span class="button-icon" aria-hidden="true">PI</span>PIANO</span>
      </a>
      <a class="game-link" href="index.html?game=addition" target="_top" aria-label="さんすうで あそぶ">
        <span><span class="button-icon" aria-hidden="true">＋−</span>さんすう</span>
      </a>
    </nav>
  </main>

      function makeCharacterSprite(kind) {
        const canvas = document.createElement("canvas");
        canvas.width = 320;
        canvas.height = 360;
        const ctx = canvas.getContext("2d");

        function stroke(width = 8, color = "#1f2230") {
          ctx.lineWidth = width;
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.strokeStyle = color;
          ctx.stroke();
        }

        function ellipse(x, y, rx, ry, fill, outline = "#1f2230", width = 8) {

          ctx.ellipse(x, y, rx, ry, 0, 0, TAU);

        }

        function roundRect(x, y, w, h, r, fill, outline = "#1f2230", width = 8) {

          ctx.roundRect(x, y, w, h, r);

      function resizeCanvas(canvas, context, cssWidth, cssHeight) {
        const ratio = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
        const pixelWidth = Math.round(cssWidth * ratio);
        const pixelHeight = Math.round(cssHeight * ratio);
        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
        }
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function normalizedPhase() {
        return ((phase % TAU) + TAU) % TAU;
      }

      function currentIndex() {
        const p = normalizedPhase();
        let nearest = 0, distance = Infinity;
        phaseAngles.forEach((angle, index) => {
          const delta = Math.abs(Math.atan2(Math.sin(p - angle), Math.cos(p - angle)));
          if (delta < distance) { nearest = index; distance = delta; }
        });
        return nearest;
      }

      function getAudioContext() {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }
        return audioContext;
      }

      function playTone() {
        try {
          const context = getAudioContext();
          const now = context.currentTime;
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(520 + currentIndex() * 32, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.08, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
          oscillator.connect(gain).connect(context.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.18);
        } catch (error) {
          // Audio is optional; the game remains fully usable without it.
        }
      }

      function stopSprunkiMusic() {
        sprunkiMusicToken += 1;

      function reportAudioError(character) {
        const status = document.getElementById("audioStatus");
        status.textContent = character.name + " のおとを よみこめませんでした";
        status.hidden = false;

      function restartSelectedSprunkiMusic() {
        if (!musicEnabled) return;
        const token = sprunkiMusicToken;
        const selected = selectedSprunkiIndexes.map(index => sprunkiCharacters[index]).filter(c => c.audioElement);
        const ids = new Set(selected.map(c => c.id));
        activeSprunkiAudios.forEach((audio, id) => {
          if (!ids.has(id)) { audio.pause(); activeSprunkiAudios.delete(id); }
        });
        document.getElementById("audioStatus").hidden = true;
        // Play within the tap handler, without periodic seeks or synthesized substitutes.
        selected.forEach(character => {
          const audio = character.audioElement;
          audio.volume = Math.min(0.75, 0.85 / Math.sqrt(selected.length));
          if (activeSprunkiAudios.has(character.id) && !audio.paused) return;
          audio.loop = true;
          audio.currentTime = 0;
          activeSprunkiAudios.set(character.id, audio);
          const attemptId = {};
          audioAttempts.set(audio, attemptId);
          try {
            const attempt = audio.play();
            if (attempt) attempt.catch(error => {
              if (token !== sprunkiMusicToken || audioAttempts.get(audio) !== attemptId || !musicEnabled || !activeSprunkiAudios.has(character.id)) return;
              activeSprunkiAudios.delete(character.id);
              reportAudioError(character);
              if (!activeSprunkiAudios.size) { musicEnabled = false; updateMusicButton(); }
            });
          } catch (error) {
            activeSprunkiAudios.delete(character.id);
            reportAudioError(character);
            if (!activeSprunkiAudios.size) { musicEnabled = false; updateMusicButton(); }
          }
        });
      }

      function moonTexture(nx, ny) {
        if (lunarMap) {
          const nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
          const u = 0.5 + Math.atan2(nx, nz) / TAU;
          const v = 0.5 + Math.asin(Math.max(-1, Math.min(1, ny))) / Math.PI;
          const x = Math.min(lunarMap.width - 1, Math.floor(u * lunarMap.width));
          const y = Math.min(lunarMap.height - 1, Math.floor(v * lunarMap.height));
          return lunarMap.data[(y * lunarMap.width + x) * 4] / 255;
        }
        let value = 0.74;
        value += Math.sin((nx * 14.1 + ny * 7.4) * Math.PI) * 0.035;
        value += Math.sin((nx * 29.7 - ny * 18.2) * Math.PI) * 0.022;
        value += Math.sin((nx * 53.3 + ny * 41.9) * Math.PI) * 0.012;

        for (const mark of moonMarks) {
          const dx = nx - mark.x;
          const dy = ny - mark.y;
          const d = Math.hypot(dx, dy);
          if (d >= mark.r) continue;
          const falloff = 1 - d / mark.r;
          if (mark.type === "mare") {
            value -= 0.16 * falloff;
          } else {
            value -= 0.18 * Math.max(0, 1 - d / (mark.r * 0.72));
            value += 0.08 * Math.max(0, 1 - Math.abs(d - mark.r * 0.72) / (mark.r * 0.22));
          }
        }

        return Math.max(0.38, Math.min(0.92, value));
      }

      function drawLitMoon(ctx, cx, cy, radius, lightX, lightY, lightZ) {
        const size = Math.max(12, Math.min(256, Math.round(radius * 4)));
        const key = size + ":" + [lightX, lightY, lightZ].map(v => Math.round(v * 160)).join(":");
        let frame = moonFrames.get(key);
        if (!frame) {
          let surface = moonSurfaces.get(size);
          if (!surface) {
            surface = new Float32Array(size * size * 4);
            for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
              const nx = (x + 0.5) / size * 2 - 1, ny = (y + 0.5) / size * 2 - 1;
              const r2 = nx * nx + ny * ny, i = (y * size + x) * 4;
              surface[i] = nx; surface[i + 1] = ny;
              surface[i + 2] = r2 <= 1 ? Math.sqrt(1 - r2) : -1;
              surface[i + 3] = r2 <= 1 ? moonTexture(nx, ny) : 0;
            }
            if (moonSurfaces.size > 24) moonSurfaces.delete(moonSurfaces.keys().next().value);
            moonSurfaces.set(size, surface);
          }
          frame = document.createElement("canvas");
          frame.width = frame.height = size;
          const painter = frame.getContext("2d");
          const image = painter.createImageData(size, size), data = image.data;
          const len = Math.hypot(lightX, lightY, lightZ) || 1;
          for (let i = 0; i < surface.length; i += 4) {
            if (surface[i + 2] < 0) continue;
            const lit = (surface[i] * lightX + surface[i + 1] * lightY + surface[i + 2] * lightZ) / len;
            const texture = surface[i + 3];
            const intensity = lit > 0 ? texture * (110 + 220 * Math.pow(lit, 0.35)) : 9 + 14 * texture;
            data[i] = intensity;
            data[i + 1] = intensity * (lit > 0 ? 0.99 : 1.1);
            data[i + 2] = intensity * (lit > 0 ? 0.95 : 1.2);
            const edge = Math.sqrt(surface[i] * surface[i] + surface[i + 1] * surface[i + 1]);
            data[i + 3] = Math.min(255, (1 - edge) * size * 255);
          }
          painter.putImageData(image, 0, 0);
          if (moonFrames.size >= 96) moonFrames.delete(moonFrames.keys().next().value);
          moonFrames.set(key, frame);
        }
        ctx.drawImage(frame, cx - radius, cy - radius, radius * 2, radius * 2);
      }

      function drawMoonPhase(ctx, cx, cy, radius, phaseValue, scaleForCraters) {

      function drawSprunkiSpriteOnEarth(ctx, earthX, earthY, earthRadius) {
        const dance = tapEffects.earth;
        const bob = dance > 0 ? Math.sin(performance.now() * 0.026) * earthRadius * 0.08 * dance : 0;
        const selected = selectedSprunkiIndexes
          .map((index) => sprunkiCharacters[index])
          .filter((character) => character.image.complete && character.image.naturalWidth);

        if (!selected.length) {
          drawSprunkiOnEarth(ctx, earthX, earthY, earthRadius);
          return;
        }

        const count = selected.length;
        const columns = Math.min(count, count <= 2 ? count : count > 12 ? 5 : 4);
        const rows = Math.ceil(count / columns);
        const minScale = count > 12 ? 0.56 : 0.78;
        const spriteHeight = earthRadius * Math.max(minScale, Math.min(2.45, 3.05 / Math.max(columns, rows)));
        const gap = earthRadius * (count > 12 ? 0.07 : 0.12);
        const rowHeight = spriteHeight * (count > 12 ? 0.48 : 0.58);
        const startY = earthY - earthRadius * (0.76 + Math.max(0, rows - 1) * (count > 12 ? 0.08 : 0.14)) + bob;

        ctx.save();
        if (dance > 0) {
          ctx.strokeStyle = `rgba(255, 241, 120, ${0.62 * dance})`;
          ctx.lineWidth = Math.max(1.2, earthRadius * 0.035);
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(earthX - earthRadius * 0.78, earthY - earthRadius * 0.62);
          ctx.lineTo(earthX - earthRadius * 0.98, earthY - earthRadius * 0.84);
          ctx.lineTo(earthX - earthRadius * 0.78, earthY - earthRadius * 1.04);
          ctx.moveTo(earthX + earthRadius * 0.78, earthY - earthRadius * 0.62);
          ctx.lineTo(earthX + earthRadius * 0.98, earthY - earthRadius * 0.84);
          ctx.lineTo(earthX + earthRadius * 0.78, earthY - earthRadius * 1.04);
          ctx.stroke();
        }
        selected.forEach((character, order) => {
          const sprite = character.image;
          const row = Math.floor(order / columns);
          const col = order % columns;
          const itemsInRow = row === rows - 1 ? count - row * columns : columns;
          const imageRatio = sprite.naturalWidth / sprite.naturalHeight;
          const spriteWidth = spriteHeight * imageRatio;
          const totalRowWidth = itemsInRow * spriteHeight * (count > 12 ? 0.42 : 0.52) + Math.max(0, itemsInRow - 1) * gap;
          const centerOffset = (col - (itemsInRow - 1) / 2) * (totalRowWidth / Math.max(1, itemsInRow));
          const x = earthX + centerOffset - spriteWidth / 2;
          const y = startY + row * rowHeight - spriteHeight * 0.54;
          ctx.drawImage(sprite, x, y, spriteWidth, spriteHeight);
        });
        ctx.restore();
      }

      function drawSprunkiOnEarth(ctx, earthX, earthY, earthRadius) {
        const dance = tapEffects.earth;
        const bob = dance > 0 ? Math.sin(performance.now() * 0.026) * earthRadius * 0.07 * dance : 0;
        const headX = earthX;
        const headY = earthY - earthRadius * 0.26 + bob;
        const headR = earthRadius * 0.58;
        const outline = Math.max(2.2, earthRadius * 0.065);
        const orange = "#ff7900";
        const darkOrange = "#d95a00";
        const peach = "#ffc08b";
        const black = "#101010";

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (dance > 0) {
          ctx.save();
          ctx.strokeStyle = `rgba(255, 241, 120, ${0.62 * dance})`;
          ctx.lineWidth = Math.max(1.2, earthRadius * 0.035);
          ctx.beginPath();
          ctx.moveTo(earthX - earthRadius * 0.78, earthY - earthRadius * 0.62);
          ctx.lineTo(earthX - earthRadius * 0.98, earthY - earthRadius * 0.84);
          ctx.lineTo(earthX - earthRadius * 0.78, earthY - earthRadius * 1.04);
          ctx.moveTo(earthX + earthRadius * 0.78, earthY - earthRadius * 0.62);
          ctx.lineTo(earthX + earthRadius * 0.98, earthY - earthRadius * 0.84);
          ctx.lineTo(earthX + earthRadius * 0.78, earthY - earthRadius * 1.04);
          ctx.stroke();
          ctx.restore();
        }

        ctx.strokeStyle = black;
        ctx.fillStyle = orange;
        ctx.lineWidth = outline;

        ctx.beginPath();
        ctx.moveTo(headX - headR * 0.26, headY + headR * 0.72);
        ctx.lineTo(headX + headR * 0.26, headY + headR * 0.72);
        ctx.lineTo(headX + headR * 0.34, earthY + earthRadius * 0.88 + bob * 0.25);
        ctx.lineTo(headX - headR * 0.34, earthY + earthRadius * 0.88 + bob * 0.25);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "rgba(172, 61, 0, 0.28)";
        ctx.beginPath();
        ctx.ellipse(headX, headY + headR * 0.78, headR * 0.34, headR * 0.11, 0, 0, TAU);
        ctx.fill();

        ctx.fillStyle = orange;
        ctx.beginPath();
        ctx.arc(headX - headR * 1.12, headY - headR * 0.02, headR * 0.33, 0, TAU);
        ctx.arc(headX + headR * 1.12, headY - headR * 0.02, headR * 0.33, 0, TAU);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = orange;
        ctx.beginPath();
        ctx.arc(headX, headY, headR, 0, TAU);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = black;
        ctx.lineWidth = Math.max(3.4, earthRadius * 0.1);
        ctx.beginPath();
        ctx.arc(headX, headY - headR * 0.02, headR * 1.28, Math.PI * 1.06, Math.PI * 1.94);
        ctx.stroke();
        ctx.strokeStyle = peach;
        ctx.lineWidth = Math.max(1.9, earthRadius * 0.055);
        ctx.beginPath();
        ctx.arc(headX, headY - headR * 0.02, headR * 1.28, Math.PI * 1.06, Math.PI * 1.94);
        ctx.stroke();

        ctx.strokeStyle = black;
        ctx.fillStyle = peach;
        ctx.lineWidth = Math.max(2.1, earthRadius * 0.06);
        const padW = headR * 0.36;
        const padH = headR * 0.86;
        ctx.beginPath();
        ctx.rect(headX - headR * 1.08, headY - padH * 0.5, padW, padH);
        ctx.rect(headX + headR * 0.72, headY - padH * 0.5, padW, padH);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = orange;
        ctx.beginPath();
        ctx.ellipse(headX - headR * 1.22, headY, headR * 0.25, headR * 0.43, 0, -Math.PI / 2, Math.PI / 2);
        ctx.ellipse(headX + headR * 1.22, headY, headR * 0.25, headR * 0.43, 0, Math.PI / 2, Math.PI * 1.5);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = black;
        ctx.lineWidth = Math.max(1.7, earthRadius * 0.045);
        ctx.beginPath();
        ctx.moveTo(headX - headR * 0.34, headY - headR * 0.78);
        ctx.lineTo(headX - headR * 0.07, headY - headR * 0.45);
        ctx.lineTo(headX + headR * 0.06, headY - headR * 0.78);
        ctx.lineTo(headX + headR * 0.31, headY - headR * 0.41);
        ctx.lineTo(headX + headR * 0.28, headY - headR * 0.76);
        ctx.stroke();

        ctx.lineWidth = Math.max(1.15, earthRadius * 0.033);
        ctx.beginPath();
        ctx.arc(headX - headR * 0.35, headY - headR * 0.27, headR * 0.24, Math.PI * 1.14, Math.PI * 1.86);
        ctx.arc(headX + headR * 0.35, headY - headR * 0.27, headR * 0.24, Math.PI * 1.14, Math.PI * 1.86);
        ctx.stroke();

        function drawHalfEye(x) {
          ctx.save();
          ctx.beginPath();
          ctx.ellipse(x, headY + headR * 0.04, headR * 0.32, headR * 0.21, 0, 0, TAU);
          ctx.clip();
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x - headR * 0.36, headY - headR * 0.03, headR * 0.72, headR * 0.35);
          ctx.fillStyle = "#050505";
          ctx.fillRect(x - headR * 0.25, headY + headR * 0.1, headR * 0.5, headR * 0.25);
          ctx.fillStyle = orange;
          ctx.fillRect(x - headR * 0.38, headY - headR * 0.24, headR * 0.76, headR * 0.22);
          ctx.restore();

          ctx.strokeStyle = black;
          ctx.lineWidth = Math.max(1.8, earthRadius * 0.046);
          ctx.beginPath();
          ctx.ellipse(x, headY + headR * 0.04, headR * 0.32, headR * 0.21, 0, 0, TAU);
          ctx.stroke();
          ctx.lineWidth = Math.max(1.25, earthRadius * 0.034);
          ctx.beginPath();
          ctx.moveTo(x - headR * 0.31, headY + headR * 0.01);
          ctx.lineTo(x + headR * 0.31, headY + headR * 0.01);
          ctx.stroke();
        }

        drawHalfEye(headX - headR * 0.35);
        drawHalfEye(headX + headR * 0.35);

        ctx.strokeStyle = black;
        ctx.lineWidth = Math.max(1.3, earthRadius * 0.035);
        ctx.beginPath();
        ctx.moveTo(headX - headR * 0.16, headY + headR * 0.42);
        ctx.quadraticCurveTo(headX, headY + headR * 0.54, headX + headR * 0.16, headY + headR * 0.42);
        ctx.stroke();
        ctx.restore();
      }

      function drawScene() {
        const w = space.clientWidth;
        const h = space.clientHeight;
        const ctx = spaceCtx;
        ctx.clearRect(0, 0, w, h);

        const centerX = w * 0.58;
        const centerY = h * 0.52;
        const orbitRadius = Math.min(w * 0.32, h * 0.37);
        const earthRadius = Math.max(28, Math.min(w, h) * 0.105);
        const moonRadius = Math.max(14, Math.min(w, h) * 0.052);
        const sunX = Math.max(25, w * 0.075);
        const sunY = centerY;
        const sunRadius = Math.max(19, Math.min(w, h) * 0.065);
        const p = normalizedPhase();
        const moonX = centerX - Math.cos(p) * orbitRadius;
        const moonY = centerY - Math.sin(p) * orbitRadius;
        const sunTap = tapEffects.sun;
        const moonTap = tapEffects.moon;
        const moonDrawRadius = Math.round(moonRadius * (1 + 0.2 * moonTap));
        sceneHitAreas = {
          orbit: { x: centerX, y: centerY, r: orbitRadius },
          sun: { x: sunX, y: sunY, r: sunRadius * 1.65 },
          earth: { x: centerX, y: centerY, r: earthRadius * 1.28 },
          moon: { x: moonX, y: moonY, r: moonRadius * 1.8 }
        };

        ctx.save();
        ctx.globalAlpha = 0.9;
        for (let i = 0; i < 20; i += 1) {
          const x = (i * 83 + 31) % w;
          const y = (i * 47 + 23) % h;
          ctx.beginPath();
          ctx.arc(x, y, i % 4 === 0 ? 1.4 : 0.9, 0, TAU);
          ctx.fillStyle = "rgba(255, 248, 223, 0.54)";
          ctx.fill();
        }
        ctx.restore();

        const sunGradient = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, sunRadius * 1.55);
        sunGradient.addColorStop(0, "#fff4a6");
        sunGradient.addColorStop(0.58, "#ffd568");
        sunGradient.addColorStop(1, "rgba(255, 156, 69, 0)");
        ctx.fillStyle = sunGradient;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius * (1.55 + 0.55 * sunTap), 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius * (1 + 0.08 * sunTap), 0, TAU);
        ctx.fillStyle = "#ffd568";
        ctx.fill();
        if (sunTap > 0) {
          ctx.save();
          ctx.strokeStyle = `rgba(255, 242, 164, ${0.75 * sunTap})`;
          ctx.lineWidth = Math.max(2, sunRadius * 0.12);
          for (let i = 0; i < 12; i += 1) {
            const a = (TAU / 12) * i + performance.now() * 0.004;
            const inner = sunRadius * 1.22;
            const outer = sunRadius * (1.68 + 0.25 * sunTap);
            ctx.beginPath();
            ctx.moveTo(sunX + Math.cos(a) * inner, sunY + Math.sin(a) * inner);
            ctx.lineTo(sunX + Math.cos(a) * outer, sunY + Math.sin(a) * outer);
            ctx.stroke();
          }
          ctx.restore();
        }

        ctx.save();
        const beamStart = sunX + sunRadius * 0.78;
        const beamEnd = w;
        // Parallel sunlight reaches the entire orbit; this is not an eclipse model.
        const beamTop = centerY - orbitRadius - moonRadius;
        const beamBottom = centerY + orbitRadius + moonRadius;
        const beamGradient = ctx.createLinearGradient(beamStart, centerY, beamEnd, centerY);
        beamGradient.addColorStop(0, "rgba(255, 226, 121, 0.08)");
        beamGradient.addColorStop(0.55, "rgba(255, 226, 121, 0.035)");
        beamGradient.addColorStop(1, "rgba(255, 226, 121, 0.03)");
        ctx.fillStyle = beamGradient;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(w, 0);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        ctx.save();
        ctx.strokeStyle = "rgba(255, 248, 223, 0.28)";
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(centerX, centerY, orbitRadius, 0, TAU);
        ctx.stroke();
        ctx.restore();

        const earthGradient = ctx.createRadialGradient(centerX - earthRadius * 0.35, centerY - earthRadius * 0.45, 2, centerX, centerY, earthRadius);
        earthGradient.addColorStop(0, "#b3f4f0");
        earthGradient.addColorStop(0.72, "#68c7c2");
        earthGradient.addColorStop(1, "#3e879f");
        ctx.beginPath();
        ctx.arc(centerX, centerY, earthRadius, 0, TAU);
        ctx.fillStyle = earthGradient;
        ctx.fill();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "#7dd77b";
        ctx.beginPath();
        ctx.ellipse(centerX - earthRadius * 0.18, centerY - earthRadius * 0.08, earthRadius * 0.32, earthRadius * 0.2, -0.5, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(centerX + earthRadius * 0.24, centerY + earthRadius * 0.18, earthRadius * 0.28, earthRadius * 0.16, 0.35, 0, TAU);
        ctx.fill();
        ctx.restore();
        ctx.beginPath();
        ctx.arc(centerX, centerY, earthRadius, 0, TAU);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.36)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.save();
        ctx.beginPath(); ctx.arc(centerX, centerY, earthRadius, 0, TAU); ctx.clip();
        const night = ctx.createLinearGradient(centerX - earthRadius * 0.1, centerY, centerX + earthRadius, centerY);
        night.addColorStop(0, "rgba(0,0,0,0)"); night.addColorStop(0.28, "rgba(5,15,18,0.55)"); night.addColorStop(1, "rgba(5,15,18,0.86)");
        ctx.fillStyle = night; ctx.fillRect(centerX, centerY - earthRadius, earthRadius, earthRadius * 2);
        ctx.restore();
        drawSprunkiSpriteOnEarth(ctx, centerX, centerY, earthRadius);

        if (moonTap > 0) {
          ctx.save();
          ctx.fillStyle = `rgba(255, 244, 168, ${0.78 * moonTap})`;
          for (let i = 0; i < 6; i += 1) {
            const a = (TAU / 6) * i + performance.now() * 0.006;
            const sx = moonX + Math.cos(a) * moonRadius * 2.05;
            const sy = moonY + Math.sin(a) * moonRadius * 2.05;
            ctx.beginPath();
            ctx.moveTo(sx, sy - moonRadius * 0.18);
            ctx.lineTo(sx + moonRadius * 0.08, sy);
            ctx.lineTo(sx, sy + moonRadius * 0.18);
            ctx.lineTo(sx - moonRadius * 0.08, sy);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        }
        drawMoonFromAbove(ctx, moonX, moonY, moonDrawRadius);
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonDrawRadius + 6, 0, TAU);
        ctx.strokeStyle = "rgba(255, 248, 223, 0.18)";
        ctx.lineWidth = 3;
        ctx.stroke();

      }

      function drawLargePhase() {
        const rect = phaseMoon.getBoundingClientRect();
        const cssSize = Math.max(1, rect.width || 90);
        resizeCanvas(phaseMoon, phaseCtx, cssSize, cssSize);
        phaseCtx.clearRect(0, 0, cssSize, cssSize);
        drawMoonPhase(phaseCtx, cssSize / 2, cssSize / 2, Math.round(cssSize * 0.42), normalizedPhase(), 1.4);
      }

      function updateText() {
        const index = currentIndex();
        const label = phaseLabels[index];
        space.setAttribute("aria-valuenow", String(Math.round(normalizedPhase() / TAU * 360)));
        space.setAttribute("aria-valuetext", label.name);
        if (index === lastTextIndex) return;
        lastTextIndex = index;
        document.querySelectorAll("#progressDots i").forEach((dot, i) => dot.classList.toggle("active", i === index));
        phaseName.textContent = label.name;
        phaseMessage.textContent = label.message;
        phaseSummary.setAttribute("aria-label", `${label.name}を読み上げる`);
        phaseMoon.setAttribute("aria-label", "地球から見える月");
        phaseList.querySelectorAll(".phase-choice").forEach((button, buttonIndex) => {
          button.classList.toggle("is-active", buttonIndex === index);
          button.setAttribute("aria-pressed", buttonIndex === index ? "true" : "false");
        });
      }

      function speakCurrentPhaseName() {
        playTone();
        if (isQuizActive()) { speakJapanese(phaseSummary.getAttribute("aria-label")); return; }
        speakJapanese(phaseLabels[currentIndex()].name);
      }

      function buildPhasePicker() {
        phaseList.innerHTML = "";
        phaseLabels.forEach((label, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "phase-choice";
          const thumbnail = document.createElement("canvas");
          thumbnail.width = thumbnail.height = 64;
          thumbnail.setAttribute("aria-hidden", "true");
          drawMoonPhase(thumbnail.getContext("2d"), 32, 32, 29, phaseAngles[index]);
          const caption = document.createElement("span");
          caption.textContent = label.name;
          button.append(thumbnail, caption);
          button.setAttribute("aria-label", `${label.name}を表示`);
          button.addEventListener("click", () => {
            playTone();
            speakJapanese(label.name);
            setPlaying(false);
            snapPhase(phaseAngles[index]);
            draw();
          });
          phaseList.appendChild(button);
        });
      }

      function buildSprunkiPicker() {
        sprunkiList.innerHTML = "";
        sprunkiCharacters.forEach((character, index) => {
          const button = document.createElement("button");
          const dot = document.createElement("img");
          const label = document.createElement("span");
          button.type = "button";
          button.className = "sprunki-choice";
          button.setAttribute("aria-label", `${character.name}にする`);
          dot.src = character.image.src;
          dot.alt = "";
          dot.width = 28; dot.height = 29;
          dot.decoding = "async";
          label.textContent = character.displayName || character.name;
          button.append(dot, label);
          button.addEventListener("click", () => {
            const selectedPosition = selectedSprunkiIndexes.indexOf(index);
            if (selectedPosition >= 0 && selectedSprunkiIndexes.length > 1) {
              selectedSprunkiIndexes.splice(selectedPosition, 1);
            } else if (selectedPosition < 0) {
              selectedSprunkiIndexes.push(index);
            }
            if (musicEnabled) restartSelectedSprunkiMusic();
            if (character.sprite) {
              speakJapanese(character.spokenName);
            } else {
              speakEnglish(character.name);
            }
            triggerTapEffect("earth");
            updateSprunkiPicker();
            draw();
          });
          sprunkiList.appendChild(button);
        });
        updateSprunkiPicker();
      }

      function updateSprunkiPicker() {
        updateMusicButton();
        sprunkiList.querySelectorAll(".sprunki-choice").forEach((button, index) => {
          const isActive = selectedSprunkiIndexes.includes(index);
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
      }

      function draw() {
        drawScene();
        updateText();
        if (isQuizActive()) updateQuizSummary();
        drawLargePhase();
      }

      function setPlaying(next) {
        cancelAnimationFrame(animationId);
        playing = next;
        playButton.innerHTML = playing
          ? '<span class="button-icon" aria-hidden="true">⏸</span>とまる'
          : '<span class="button-icon" aria-hidden="true">▶</span>うごく';
        playButton.setAttribute("aria-label", playing ? "停止する" : "再生する");
        if (playing) {
          lastTime = performance.now();
          animationId = requestAnimationFrame(tick);
        } else {
          cancelAnimationFrame(animationId);
        }
      }

      function tick(time) {
        const delta = Math.min(48, time - lastTime);
        lastTime = time;
        phase += delta * 0.00022;
        draw();
        if (playing) {
          animationId = requestAnimationFrame(tick);
        }
      }

      function snapPhase(value) {
        phase = ((value % TAU) + TAU) % TAU;
      }

      const effectAnimations = new Map();
      function triggerTapEffect(kind) {
        if (reducedMotion.matches) { draw(); return; }
        cancelAnimationFrame(effectAnimations.get(kind));
        tapEffects[kind] = 1;
        const startedAt = performance.now();

        function fade(now) {
          const progress = Math.min(1, (now - startedAt) / 760);
          tapEffects[kind] = 1 - progress;
          draw();
          if (progress < 1) effectAnimations.set(kind, requestAnimationFrame(fade));
        }

        effectAnimations.set(kind, requestAnimationFrame(fade));
      }

      function handleSceneTap(event) {
        if (suppressClick) { suppressClick = false; return; }
        if (!sceneHitAreas) return;
        const rect = space.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const hits = ["sun", "moon", "earth"];
        const hit = hits.find((kind) => {
          const area = sceneHitAreas[kind];
          return Math.hypot(x - area.x, y - area.y) <= area.r;
        });

        if (!hit) return;
        playTone();
        if (hit === "moon" && !isQuizActive()) {
          setPlaying(false);
          snapPhase(phaseAngles[(currentIndex() + 1) % phaseAngles.length]);
          speakJapanese(phaseLabels[currentIndex()].name);
        } else if (hit === "earth" && musicEnabled) {
          restartSelectedSprunkiMusic();
        }
        triggerTapEffect(hit);
        draw();
      }

      playButton.addEventListener("click", () => {
        playTone();
        setPlaying(!playing);
      });

      stepButton.addEventListener("click", () => {
        playTone();
        setPlaying(false);
        snapPhase(phaseAngles[(currentIndex() + 1) % phaseAngles.length]);
        speakJapanese(phaseLabels[currentIndex()].name);
        draw();
      });

      resetButton.addEventListener("click", () => {
        playTone();
        setPlaying(false);
        snapPhase(0);
        speakJapanese(phaseLabels[0].name);
        draw();
      });

      musicButton.addEventListener("click", () => {
        musicEnabled = !musicEnabled;
        if (musicEnabled) {
          restartSelectedSprunkiMusic();
        } else {
          stopSprunkiMusic();
        }
        updateMusicButton();
      });

      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("orientationchange", () => setTimeout(resize, 150), { passive: true });
      space.addEventListener("click", handleSceneTap);
      phaseSummary.addEventListener("click", speakCurrentPhaseName);
      phaseSummary.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        speakCurrentPhaseName();
      });


      let drag = null;
      let suppressClick = false;
      function moveMoon(event) {
        if (isQuizActive()) return;
        const rect = space.getBoundingClientRect(), orbit = sceneHitAreas.orbit;
        const dx = event.clientX - rect.left - orbit.x, dy = event.clientY - rect.top - orbit.y;
        if (Math.hypot(dx, dy) < 10) return;
        snapPhase(Math.atan2(-dy, -dx));
        draw();
      }
      space.addEventListener("pointerdown", event => {
        if (isQuizActive() || !sceneHitAreas || event.button !== 0) return;
        const rect = space.getBoundingClientRect(), orbit = sceneHitAreas.orbit;
        const dx = event.clientX - rect.left - orbit.x, dy = event.clientY - rect.top - orbit.y;
        if (Math.abs(Math.hypot(dx, dy) - orbit.r) > 30) return;
        drag = { id: event.pointerId, x: event.clientX, y: event.clientY, moved: false };
        suppressClick = false;
        space.setPointerCapture(event.pointerId);
        setPlaying(false);
      });
      space.addEventListener("pointermove", event => {
        if (!drag || event.pointerId !== drag.id) return;
        if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) > 4) drag.moved = true;
        if (drag.moved) moveMoon(event);
      });
      function endDrag(event) {
        if (!drag || event.pointerId !== drag.id) return;
        suppressClick = drag.moved;
        if (drag.moved && !isQuizActive()) speakJapanese(phaseLabels[currentIndex()].name);
        if (space.hasPointerCapture(event.pointerId)) space.releasePointerCapture(event.pointerId);
        drag = null;
      }
      space.addEventListener("pointerup", endDrag);
      space.addEventListener("pointercancel", event => {
        endDrag(event);
        suppressClick = true;
      });
      space.addEventListener("keydown", event => {
        if (isQuizActive()) return;
        const direction = event.key === "ArrowRight" || event.key === "ArrowUp" ? 1
          : event.key === "ArrowLeft" || event.key === "ArrowDown" ? -1 : 0;
        if (!direction && event.key !== "Home" && event.key !== "End") return;
        event.preventDefault(); setPlaying(false);
        const index = event.key === "Home" ? 0 : event.key === "End" ? 15 : (currentIndex() + direction + 16) % 16;
        snapPhase(phaseAngles[index]); draw(); speakJapanese(phaseLabels[index].name);
      });

      const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
      function selectPanel(tab) {
        const wasQuiz = isQuizActive();
        if (!wasQuiz && tab.dataset.panel === "quizPanel") explorationPhase = phase;
        tabs.forEach(item => {
          const selected = item === tab;
          item.setAttribute("aria-selected", String(selected));
          item.tabIndex = selected ? 0 : -1;
        });
        new Set(tabs.map(item => item.dataset.panel)).forEach(id => {
          document.getElementById(id).hidden = id !== tab.dataset.panel;
        });
        const quiz = tab.dataset.panel === "quizPanel";
        document.body.classList.toggle("in-quiz", quiz);
        [playButton, stepButton, resetButton].forEach(button => { button.disabled = quiz; });
        space.setAttribute("aria-disabled", String(quiz));
        phaseSummary.classList.remove("is-masked");
        lastTextIndex = -1;
        if (quiz) {
          setPlaying(false);
          if (drag && space.hasPointerCapture(drag.id)) space.releasePointerCapture(drag.id);
          drag = null;
          quizMode = tab.dataset.quizMode;
          quizState = quizSessions[quizMode];
          quizPanel.dataset.mode = quizMode;
          quizPanel.setAttribute("aria-labelledby", tab.id);
          if (!quizState.question) nextQuiz();
          else { renderQuiz(); speakJapanese(quizState.solved ? quizAnswerText() : quizState.question.prompt); }
        } else {
          if (wasQuiz) snapPhase(explorationPhase);
          phaseSummary.querySelector(".small-label").textContent = "ちきゅうから みえる";
          draw();
          if (window.speechSynthesis) window.speechSynthesis.cancel();
        }
      }
      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => selectPanel(tab));
        tab.addEventListener("keydown", event => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          event.preventDefault();
          const next = event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 : (index + (event.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
          tabs[next].focus(); selectPanel(tabs[next]);
        });
      });
      const quizPanel = document.getElementById("quizPanel");
      const quizNext = document.getElementById("quizNext");
      // Use eight astronomical shapes, not calendar-day names with ambiguous ages.
      const quizShapes = Object.freeze([
        { name: "しんげつ", clue: "しんげつ は どれ？", detail: "ひかる がわが みえないね" },
        { name: "ふくらむ細い月", clue: "まんげつに むかう、ほそいつき は？", detail: "みぎが ほそく ひかるね" },
        { name: "じょうげん", clue: "じょうげんの つき は どれ？", detail: "みぎ はんぶんが ひかるね" },
        { name: "ふくらむ丸い月", clue: "まんげつに むかう、はんぶんより まるいつき は？", detail: "みぎから まるくなるね" },
        { name: "まんげつ", clue: "まんげつ は どれ？", detail: "ぜんぶ まるく ひかるね" },
        { name: "かけていく丸い月", clue: "まんげつの あと、まだ はんぶんより まるいつき は？", detail: "みぎから かけていくね" },
        { name: "かげん", clue: "かげんの つき は どれ？", detail: "ひだり はんぶんが ひかるね" },
        { name: "かけていく細い月", clue: "しんげつに むかう、ほそいつき は？", detail: "ひだりが ほそく ひかるね" }
      ].map((shape, id) => Object.freeze({ ...shape, id, angle: id * TAU / 8 })));
      // Each mode owns its progress; changing tabs never transfers a question or score.
      const quizSessions = Object.fromEntries(["current", "future"].map(mode => [mode, {
        question: null, solved: false, stars: 0, deck: [], wrong: new Set(), feedback: ""
      }]));
      let quizMode = "current", quizState = quizSessions.current, quizSerial = 0;
      let explorationPhase = phase;
      function isQuizActive() { return !!quizState.question && !quizPanel.hidden; }
      function shuffleQuiz(items) {
        const result = [...items];
        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }
      function quizAnswerText() {
        const answer = quizShapes[quizState.question.answer];
        if (quizState.question.kind === "order") {
          const source = quizShapes[quizState.question.source];
          return "みつけた！ " + source.name + "の、やく１しゅうかんごは、" + answer.name + "。";
        }
        return "みつけた！ " + answer.name + "。" + answer.detail;
      }
      function syncQuizScene() {
        // The diagram is the question's reference, never the future answer.
        snapPhase(quizShapes[quizState.question.source].angle);
        lastTextIndex = -1;
        draw();
      }
      function updateQuizSummary() {
        const masked = !quizState.solved && quizState.question.kind !== "order";
        phaseSummary.classList.toggle("is-masked", masked);
        const shape = quizShapes[quizState.question.source];
        const future = quizState.question.kind === "order";
        phaseSummary.querySelector(".small-label").textContent = future ? "いまのつき" : quizState.solved ? "こたえ" : "ちきゅうから みえる";
        phaseName.textContent = masked ? "どんな かたち？" : shape.name;
        phaseMessage.textContent = masked ? "にほんで みあげた むき" : shape.detail;
        phaseSummary.setAttribute("aria-label", future ? "いまのつきは、" + shape.name + "。" + shape.detail : quizState.solved ? quizAnswerText() : quizState.question.prompt);
        phaseMoon.setAttribute("aria-label", masked ? "こたえは まだ ひみつ" : shape.name);
        space.setAttribute("aria-valuetext", "クイズの月の位置");
      }
      function nextQuiz() {
        if (quizState.question && !quizState.solved) return;
        if (!quizState.deck.length) {
          const kinds = quizMode === "future" ? ["order"] : ["name", "orbit"];
          quizState.deck = shuffleQuiz(kinds.flatMap(kind => quizShapes.map(shape => ({ kind, source: shape.id }))));
        }
        const { kind, source } = quizState.deck.pop();
        // A quarter of the mean synodic month is about one week (7.38 days).
        const answer = kind === "order" ? (source + 2) % 8 : source;
        const prompt = kind === "name" ? quizShapes[source].clue
          : kind === "order" ? "いまのつきの、やく１しゅうかんごの かたちは？"
          : "ずの いちで、ちきゅうから みえる つきは？";
        const question = Object.freeze({
          id: ++quizSerial, kind, source, answer, prompt,
          options: Object.freeze(shuffleQuiz(quizShapes.map(shape => shape.id)))
        });
        quizState.question = question;
        quizState.solved = false;
        quizState.wrong.clear();
        quizState.feedback = "★ " + quizState.stars;
        renderQuiz();
        speakJapanese(prompt);
      }
      function renderQuiz() {
        const state = quizState, question = state.question;
        quizNext.disabled = !state.solved;
        quizPanel.dataset.questionId = String(question.id);
        quizPanel.dataset.kind = question.kind;
        quizPanel.dataset.source = String(question.source);
        document.getElementById("quizPrompt").textContent = question.prompt;
        document.getElementById("quizResult").textContent = state.feedback;
        const container = document.getElementById("quizOptions");
        container.replaceChildren();
        question.options.forEach(id => {
          const button = document.createElement("button"), canvas = document.createElement("canvas");
          button.type = "button";
          button.dataset.phase = String(id);
          button.setAttribute("aria-label", quizShapes[id].name);
          canvas.width = canvas.height = 128;
          canvas.setAttribute("aria-hidden", "true");
          drawMoonPhase(canvas.getContext("2d"), 64, 64, 54, quizShapes[id].angle);
          button.append(canvas);
          button.classList.toggle("try-again", state.wrong.has(id));
          button.classList.toggle("correct", state.solved && id === question.answer);
          button.addEventListener("click", () => {
            if (!button.isConnected || !isQuizActive() || quizState !== state || state.question !== question || state.solved) return;
            if (id === question.answer) {
              quizState.solved = true;
              quizState.stars++;
              button.classList.remove("try-again");
              button.classList.add("correct");
              quizNext.disabled = false;
              syncQuizScene(); triggerTapEffect("moon");
              state.feedback = "★ " + state.stars + " みつけた！\nこたえ：" + quizShapes[question.answer].name;
              document.getElementById("quizResult").textContent = state.feedback;
              playTone(); speakJapanese(quizAnswerText());
            } else {
              state.wrong.add(id);
              button.classList.add("try-again");
              state.feedback = "もういちど";
              document.getElementById("quizResult").textContent = state.feedback;
              speakJapanese("もういちど");
            }
          });
          container.append(button);
        });
        syncQuizScene();
      }
      quizNext.addEventListener("click", () => {
        if (!isQuizActive() || !quizState.solved) return;
        nextQuiz();
        document.getElementById("quizPrompt").focus({ preventScroll: true });
      });
      document.getElementById("quizPrompt").addEventListener("click", () => {
        if (quizState.question) speakJapanese(quizState.question.prompt);
      });
      document.getElementById("voiceButton").addEventListener("click", event => {
        voiceEnabled = !voiceEnabled;
        if (!voiceEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
        event.currentTarget.setAttribute("aria-pressed", String(voiceEnabled));
        event.currentTarget.setAttribute("aria-label", voiceEnabled ? "読み上げをオフにする" : "読み上げをオンにする");
        event.currentTarget.textContent = voiceEnabled ? "♬" : "♩";
      });
      const fullscreenButton = document.getElementById("fullscreenButton");
      if (!document.documentElement.requestFullscreen) fullscreenButton.hidden = true;
      fullscreenButton.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (error) { fullscreenButton.hidden = true; }
      });
      document.addEventListener("fullscreenchange", () => {
        fullscreenButton.setAttribute("aria-label", document.fullscreenElement ? "全画面表示を終了" : "全画面表示");
        resize();
      });
      function pauseForBackground() {
        setPlaying(false);
        musicEnabled = false;
        stopSprunkiMusic(); updateMusicButton();
        if (window.speechSynthesis) window.speechSynthesis.cancel();
      }
      window.addEventListener("pagehide", pauseForBackground);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) pauseForBackground();
      });
      phaseLabels.forEach(() => document.getElementById("progressDots").append(document.createElement("i")));

      buildPhasePicker();
      buildSprunkiPicker();
      updateMusicButton();
      resize();
    })();
  </script>
</body>
</html>
