<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh}
button,select{font:inherit}

main{margin:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo,h1{font-weight:900}
h1{margin:0}
.sound{min-height:46px;padding:8px 16px;font-size:15px;font-weight:800}
.stage{position:relative}
.stage-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}

.hands-on input{width:22px;height:22px;margin:0;accent-color:var(--game-primary,#b9edcc)}

.group.left,.group.right{border-bottom-style:solid}

.character{position:relative;flex:0 1 83px;width:83px;min-width:48px;height:142px;background:transparent;border:0;padding:0 3px 30px;transition:transform .18s}
.character:hover{transform:translateY(-5px)}

.character img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.count-tag{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:29px;height:29px;line-height:29px;font-weight:900;font-size:17px}
.character.counted{animation:hop .32s ease}
.equation{display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1.25}
.equation .operator{font-size:.78em}
.mystery{text-align:center;padding:5px 10px}
.prompt{text-align:center;font-weight:900}
.answer{line-height:1.1;font-weight:900;transition:transform .12s,background .12s}
.answer:hover:not(:disabled){transform:translateY(-3px)}
.answer:active:not(:disabled){transform:translateY(3px)}
.actions{display:flex;align-items:center;justify-content:center}
.next{font-weight:900}
.tip{margin:0;text-align:center}
.settings{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;font-size:14px}
.settings select{border:1px solid;min-height:44px;padding:8px;font-size:15px}
.settings button{border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;min-height:44px;font-size:14px}
.settings label{display:flex;align-items:center;gap:8px}
.party{text-align:center}

.band img{width:28%;object-fit:contain;animation:dance .65s ease-in-out infinite alternate}
.band img:nth-child(2){animation-delay:-.3s}
.band img:nth-child(3){animation-delay:-.5s}
.progress{display:flex;justify-content:center}
.star{line-height:1}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;left:var(--x);top:-20px;width:10px;height:18px;background:var(--c);border-radius:3px;animation:fall 1.8s ease-in var(--d) both}
.mode-picker{display:flex;justify-content:center}
.mode-picker button{font-weight:900}
.music-bar{display:flex;align-items:center;flex-wrap:wrap;font-size:14px}
.music-bar button,.music-bar select{min-height:44px;border:1px solid;padding:8px 12px}
.music-bar button{font-weight:900;font-size:16px}
.music-bar label{display:flex;align-items:center;gap:6px}

.groups.subtract{display:block}

.groups.subtract #right,.groups.subtract .plus{display:none}
.character.gone{filter:grayscale(1);pointer-events:none}

.character.gone .count-tag{width:40px}
.group.dense .character{flex-basis:48px;width:48px;height:91px;min-width:44px}
.group.dense{align-content:center}
[hidden]{display:none!important}
@keyframes hop{50%{transform:translateY(-10px)}}

<script>
"use strict";
// Pure game model: the UI and automated checks share the same transitions.
const AdditionGame = (() => {
  function shuffle(values, rng = Math.random) { const list = [...values]; for(let i=list.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[list[i],list[j]]=[list[j],list[i]];}return list; }
  function createSession(max=5, rng=Math.random,operation='add'){
    if(![5,10,20].includes(max))throw new RangeError('Unsupported level');
    if(!['add','subtract'].includes(operation))throw new RangeError('Unsupported operation');
    const pairs=[];
    if(operation==='add'){for(let a=1;a<max;a++)for(let b=1;b<=max-a;b++){if(max!==20||a+b>10)pairs.push({a,b});}}
    else{for(let a=max===20?11:1;a<=max;a++)for(let b=1;b<=a;b++)pairs.push({a,b});}
    let deck=shuffle(pairs,rng).slice(0,5);
    if(max===5&&operation==='add'){deck=[{a:1,b:1},...shuffle(pairs.filter(p=>p.a+p.b>2),rng).slice(0,4)];}
    if(max===5&&operation==='subtract'){deck=[{a:3,b:1},...shuffle(pairs.filter(p=>!(p.a===3&&p.b===1)),rng).slice(0,4)];}
    deck=deck.map(p=>{const total=operation==='subtract'?p.a-p.b:p.a+p.b;const min=operation==='subtract'?0:1;const values=Array.from({length:max-min+1},(_,i)=>i+min).filter(n=>n!==total);const nearby=values.filter(n=>Math.abs(n-total)<=3);const others=shuffle(nearby.length>=2?nearby:values,rng).slice(0,2);return {...p,total,choices:shuffle([total,...others],rng)};});
    const runId=globalThis.crypto?.randomUUID?.()||`addition-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    return {max,operation,deck,index:0,stars:0,phase:'playing',counted:[],handsOn:false,removed:[],handsOnStars:0,runId,firstTry:0,attempted:false};
  }
  function needsRemoval(state){return state.handsOn&&state.removed.length<state.deck[state.index].b;}
  function setHandsOn(state,enabled){if(state.phase!=='playing'||state.operation!=='subtract')return false;state.handsOn=Boolean(enabled);state.removed=[];state.counted=[];return true;}
  function remove(state,id){const p=state.deck[state.index];if(state.phase!=='playing'||!needsRemoval(state)||!Number.isInteger(id)||id<0||id>=p.a||state.removed.includes(id))return null;state.removed.push(id);return state.removed.length;}
  function answer(state,value){if(state.phase!=='playing')return 'ignored';if(!state.deck[state.index].choices.includes(value))return 'invalid';if(needsRemoval(state))return 'remove-first';if(value!==state.deck[state.index].total){state.attempted=true;return 'retry';}if(!state.attempted)state.firstTry++;state.attempted=true;state.stars++;if(state.handsOn)state.handsOnStars++;state.phase='solved';return 'correct';}
  // Hands-on counters retain their physical IDs even when any member goes home.
  function count(state,id){const p=state.deck[state.index],limit=state.handsOn?p.a:p.total;if(state.phase!=='playing'||needsRemoval(state)||!Number.isInteger(id)||id<0||id>=limit||(state.handsOn&&state.removed.includes(id))||state.counted.includes(id))return null;state.counted.push(id);return state.counted.length;}
  function next(state){if(state.phase!=='solved')return false;if(state.stars===5){state.phase='complete';return true;}state.index++;state.counted=[];state.removed=[];state.attempted=false;state.phase='playing';return true;}
  return {createSession,answer,count,next,setHandsOn,remove,needsRemoval};
})();
</script>
<script>
(() => {
const $=id=>document.getElementById(id);
let state=AdditionGame.createSession(),sound=false,audio=null,voices=[],timers=[];
let advanceTimer=null,advanceGeneration=0;
const activeNotes=new Set();
let operation='add',musicWanted=false,musicGeneration=0;
const music=$('musicAudio');
const tracks={oren:'sounds/oren.wav',sky:'sounds/sky.wav',simon:'sounds/simon.wav'};
function musicLabel(){$('musicToggle').setAttribute('aria-pressed',String(musicWanted));$('musicToggle').textContent=musicWanted?'❚❚ おんがくを とめる':'▶ おんがくを ながす';}
function musicVolume(){music.volume=Number($('musicVolume').value)/100;}
function pauseMusic(){musicGeneration++;music.pause();musicLabel();}
async function playMusic(){
  if(!musicWanted||document.hidden)return;
  const generation=++musicGeneration;
  const src=tracks[$('musicTrack').value];
  if(!src)return;
  if(music.getAttribute('src')!==src){music.pause();music.setAttribute('src',src);}
  musicVolume();musicLabel();$('musicStatus').textContent='おんがくを よみこみちゅう…';
  try{await music.play();if(generation!==musicGeneration){if(!musicWanted||document.hidden)music.pause();return;}if(!musicWanted||document.hidden){music.pause();return;}musicLabel(true);$('musicStatus').textContent='';}
  catch{if(generation!==musicGeneration)return;music.pause();musicWanted=false;musicLabel();$('musicStatus').textContent='おんがくボタンを もういちど おしてね';}
}
const characters=[{file:'sprunki-oren.png',name:'オレン'},{file:'sprunki-sky.png',name:'スカイ'},{file:'sprunki-simon.png',name:'サイモン'}];
const speech=window.speechSynthesis;
function loadVoices(){voices=speech?.getVoices?.()||[];}loadVoices();speech?.addEventListener?.('voiceschanged',loadVoices);
function speak(text){if(!sound||!speech||!window.SpeechSynthesisUtterance||document.hidden)return;speech.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.82;u.pitch=1.12;const v=voices.find(v=>v.lang.startsWith('ja'));if(v)u.voice=v;speech.speak(u);}
function unlock(){if(!sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio??=new AC();if(audio.state==='suspended')void audio.resume().catch(()=>{});}catch{}}
function tone(freq,delay=0,duration=.18){if(!sound||!audio||document.hidden)return;try{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;const start=audio.currentTime+delay;g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(.12,start+.02);g.gain.exponentialRampToValueAtTime(.001,start+duration);o.connect(g);g.connect(audio.destination);activeNotes.add(o);o.onended=()=>{activeNotes.delete(o);o.disconnect();g.disconnect();};o.start(start);o.stop(start+duration+.03);}catch{}}
function tune(party=false){unlock();(party?[262,330,392,523,392,440,494,523]:[330,440,554,660]).forEach((f,i)=>tone(f,i*(party?.24:.12),.23));}
function stopNotes(){for(const o of activeNotes){try{o.stop();o.disconnect();}catch{}}activeNotes.clear();}
function stopAudio(){speech?.cancel();stopNotes();if(audio&&audio.state==='running')void audio.suspend().catch(()=>{});}
function cancelAdvance(){clearTimeout(advanceTimer);advanceTimer=null;advanceGeneration++;}
function clearEffects(){cancelAdvance();timers.forEach(clearTimeout);timers=[];$('confetti').replaceChildren();speech?.cancel();stopNotes();}
function scheduleAdvance(){
  cancelAdvance();
  if(state.phase!=='solved'||document.hidden)return;
  const answeredSession=state,answeredIndex=state.index,generation=advanceGeneration;
  let waited=1800;
  function finish(){
    if(generation!==advanceGeneration||state!==answeredSession||state.index!==answeredIndex||state.phase!=='solved'||document.hidden)return;
    if(sound&&(speech?.speaking||speech?.pending)&&waited<6000){waited+=150;advanceTimer=setTimeout(finish,150);return;}
    advanceTimer=null;advance();
  }
  advanceTimer=setTimeout(finish,1800);
}
function soundLabel(){$('sound').textContent=sound?'◖♪ こえ あり':'◖♪ こえを つける';$('sound').setAttribute('aria-pressed',String(sound));}
function confetti(){const colors=['#ef9850','#81b293','#b697d5','#edca51'];$('confetti').innerHTML=Array.from({length:25},(_,i)=>`<i style="--x:${i*4}%;--c:${colors[i%4]};--d:${(i%5)*.09}s"></i>`).join('');timers.push(setTimeout(()=>$('confetti').replaceChildren(),2400));}
function question(){const p=state.deck[state.index];return AdditionGame.needsRemoval(state)?`${p.a}にんいるよ。${p.b-state.removed.length}にん、おうちへかえしてね。`:state.operation==='subtract'?`${p.a}にんから、${p.b}にん、かえったよ。のこりは、なんにん？`:`${p.a}にんと、${p.b}にん。あわせて、なんにん？`;}
function prompt(){return state.operation==='subtract'?'のこりは なんにん？':'あわせて なんにん？';}
function operatorWord(){return state.operation==='subtract'?'ひく':'たす';}
function renderStars(){$('progress').innerHTML=Array.from({length:5},(_,i)=>`<span class="star ${i<state.stars?'earned':''}" aria-hidden="true">★</span>`).join('');$('progress').setAttribute('aria-label',`5もんちゅう ${state.stars}もん できた`);}
function syncHandsOn(){
  $('handsOnLabel').hidden=state.operation!=='subtract';$('handsOn').disabled=state.phase!=='playing';
  if(!state.handsOn)return;
  const p=state.deck[state.index],pending=AdditionGame.needsRemoval(state);
  $('groupLabel').textContent=`かえった ${state.removed.length} / ${p.b} にん`;
  for(const button of $('left').children){const gone=state.removed.includes(Number(button.dataset.counterId));button.classList.toggle('gone',gone);button.disabled=gone||state.phase!=='playing';if(gone){button.setAttribute('aria-label','おうちに かえったよ');button.querySelector('span').textContent='かえった';}else if(!button.classList.contains('counted'))button.setAttribute('aria-label',pending?'おうちへ かえす':'のこった なかまを かぞえる');}
  for(const button of $('answers').children)button.disabled=pending||state.phase!=='playing';
  if(state.phase==='playing'){$('message').textContent=pending?`あと ${p.b-state.removed.length}にん おうちへ`:prompt();$('tip').textContent=pending?`${p.b}にん おうちへ`:p.total===0?'だれも いないね。「0」を おしてね':'のこっている なかまを タッチして かぞえよう';}
}
function renderGroup(id,n,offset,char,remaining=n){const group=$(id);group.replaceChildren();group.classList.toggle('many',n>3);group.classList.toggle('dense',state.max===20);
  // Two rows keep each counting target reachable without changing the question.
  const columns=n>4?Math.ceil(n/2):n;
  group.style.setProperty('--group-columns',String(columns));
  group.style.setProperty('--group-rows',String(n>4?2:1));
  $('groups').style.setProperty(id==='left'?'--left-weight':'--right-weight',`${Math.max(2,columns)}fr`);
  for(let i=0;i<n;i++){
  // Default hints remove the last b; hands-on play preserves the child's selection.
  const gone=state.handsOn?state.removed.includes(i):i>=remaining,button=document.createElement(gone&&!state.handsOn?'div':'button');button.className=gone?'character gone':'character';button.dataset.counterId=offset+i;button.setAttribute('aria-label',gone?`${char.name}は かえったよ`:`${char.name}を かぞえる`);button.innerHTML=`<img src="${char.file}" alt="" draggable="false"><span class="count-tag" aria-hidden="true">${gone?'かえった':'♪'}</span>`;
  if(!gone)button.addEventListener('click',()=>{
    if(AdditionGame.needsRemoval(state)){const removed=AdditionGame.remove(state,offset+i);if(removed===null)return;unlock();syncHandsOn();tone(440-removed*8);speak(AdditionGame.needsRemoval(state)?`あと${state.deck[state.index].b-removed}にん`:`${removed}にん かえったね。のこりは なんにん？`);if(button.disabled){const target=$('left').querySelector('button:not(:disabled)')||$('answers').querySelector('button:not(:disabled)');target?.focus({preventScroll:true});}return;}
    const number=AdditionGame.count(state,offset+i);if(number===null)return;unlock();button.classList.add('counted');button.setAttribute('aria-label',`${number}にんめ、かぞえたよ`);button.setAttribute('aria-pressed','true');button.querySelector('span').textContent=number;$('message').textContent=`${number}にん！`;tone(262+number*30);speak(`${number}にん`);
  });group.append(button);
}}
function renderCharacters(){const p=state.deck[state.index],subtract=state.operation==='subtract';$('groups').classList.toggle('subtract',subtract);renderGroup('left',p.a,0,characters[state.index%3],subtract?p.total:p.a);if(subtract)$('right').replaceChildren();else renderGroup('right',p.b,p.a,characters[(state.index+1)%3]);$('groupLabel').textContent=subtract?`${p.a}にんから ${p.b}にん かえったよ`:'なかまを タッチしてね';}
function render(){const p=state.deck[state.index];$('play').hidden=false;$('party').hidden=true;$('play').setAttribute('aria-label',state.operation==='subtract'?'ひきざん あそび':'たしざん あそび');$('round').textContent=`${state.index+1} / 5 もんめ`;$('equation').innerHTML=`<span>${p.a}</span><span class="operator">${state.operation==='subtract'?'−':'+'}</span><span>${p.b}</span><span class="operator">=</span><span class="mystery">?</span>`;$('equation').setAttribute('aria-label',`${p.a}${operatorWord()}${p.b}は？`);renderCharacters();$('message').textContent=prompt();$('next').hidden=true;$('tip').hidden=false;$('tip').textContent=p.total===0?'だれも いないね。「0」を おしてね':'のこっている なかまを タッチして かぞえよう';if(state.operation==='add')$('tip').textContent='なかまを タッチすると かぞえられるよ';$('answers').replaceChildren();for(const n of p.choices){const b=document.createElement('button');b.className='answer';b.textContent=n;b.setAttribute('aria-label',`${n}にん`);b.addEventListener('click',()=>choose(n));$('answers').append(b);}renderStars();syncHandsOn();}
function choose(n){
  const result=AdditionGame.answer(state,n);
  if(result==='retry'){state.counted=[];renderCharacters();syncHandsOn();$('message').textContent=state.deck[state.index].total===0?'だれも いないね。0にんだよ':'いっしょに かぞえてみよう ♪';speak(state.deck[state.index].total===0?'だれもいないね。ゼロにんだよ':'いっしょに、なかまをタッチして、かぞえてみよう');return result;}
  if(result!=='correct')return result;
  const p=state.deck[state.index];unlock();syncHandsOn();$('message').textContent=`せいかい！ ${p.total}にんだね！`;$('equation').querySelector('.mystery').textContent=p.total;$('equation').setAttribute('aria-label',`${p.a}${operatorWord()}${p.b}は${p.total}`);for(const b of $('answers').children){b.disabled=true;b.classList.toggle('correct',Number(b.textContent)===p.total);}$('next').textContent=state.stars===5?'おんがくかいへ ♪':'つぎへ →';$('next').hidden=false;$('tip').hidden=true;renderStars();tune();speak(`せいかい！ ${p.total}にんだね！`);confetti();scheduleAdvance();$('next').focus({preventScroll:true});return result;
}
function completeRanking(){
  try{void Promise.resolve(window.MoonRanking?.complete({game:'addition',mode:`${state.operation==='subtract'?'sub':'add'}-${state.max}`,runId:state.runId,metrics:{firstTry:state.firstTry,completed:5,total:5}})).catch(()=>{});}catch{}
}
function advance(){if(!AdditionGame.next(state))return false;clearEffects();if(state.phase==='complete'){$('play').hidden=true;$('party').hidden=false;$('party').querySelector('p').textContent=state.handsOnStars?`じぶんで ${state.handsOnStars}もん ひけたね！`:'みんなで おいわいの おんがくかい ♪';confetti();tune(true);speak('やったね！ ぜんぶできたね！');$('partyTitle').focus({preventScroll:true});completeRanking();}else{render();speak(question());$('read').focus({preventScroll:true});}return true;}
function restart(){clearEffects();stopAudio();state=AdditionGame.createSession(Number($('level').value),Math.random,operation);AdditionGame.setHandsOn(state,$('handsOn').checked);render();speak(question());}
function setOperation(value){operation=value;$('addMode').setAttribute('aria-pressed',String(value==='add'));$('subtractMode').setAttribute('aria-pressed',String(value==='subtract'));restart();}
$('addMode').addEventListener('click',()=>setOperation('add'));$('subtractMode').addEventListener('click',()=>setOperation('subtract'));
$('handsOn').addEventListener('change',()=>{if(!AdditionGame.setHandsOn(state,$('handsOn').checked))return;clearEffects();stopAudio();render();speak(question());});
$('musicToggle').addEventListener('click',()=>{musicWanted=!musicWanted;if(musicWanted)void playMusic();else{pauseMusic();$('musicStatus').textContent='';}});
$('musicTrack').addEventListener('change',()=>{pauseMusic();if(musicWanted)void playMusic();});$('musicVolume').addEventListener('input',musicVolume);
music.addEventListener('error',()=>{if(musicWanted){musicWanted=false;pauseMusic();$('musicStatus').textContent='おんがくを よめなかったよ。もういちど おしてね';}});
$('sound').addEventListener('click',()=>{sound=!sound;soundLabel();if(sound){unlock();tone(440);speak(state.phase==='complete'?'やったね！':question());}else stopAudio();});
$('read').addEventListener('click',()=>{sound=true;soundLabel();unlock();speak(question());});$('next').addEventListener('click',advance);$('again').addEventListener('click',restart);$('restart').addEventListener('click',restart);$('level').addEventListener('change',restart);document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAdvance();stopAudio();pauseMusic();}else{scheduleAdvance();if(musicWanted)void playMusic();}});window.addEventListener('pageshow',()=>{scheduleAdvance();if(musicWanted)void playMusic();});window.addEventListener('pagehide',()=>{clearEffects();stopAudio();pauseMusic();});
render();
const context=document.modelContext;if(context?.registerTool){const lifecycle=new AbortController();window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});for(const tool of [{name:'read_addition_game',description:'Read the current arithmetic question, operation, difficulty, choices and progress.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>({question:state.deck[state.index],operation:state.operation,max:state.max,stars:state.stars,phase:state.phase})},{name:'answer_addition_question',description:'Choose one of the visible answers to the current arithmetic question.',inputSchema:{type:'object',properties:{answer:{type:'integer'}},required:['answer'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:input=>{if(!input||!Number.isInteger(input.answer)||!state.deck[state.index].choices.includes(input.answer))throw new Error('Choose a displayed answer');return {result:choose(input.answer),stars:state.stars,phase:state.phase};}},{name:'next_addition_question',description:'Continue after a correct answer, or open the celebration after five answers.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>({advanced:advance(),phase:state.phase})}]){try{void Promise.resolve(context.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}}}
})();
</script>
