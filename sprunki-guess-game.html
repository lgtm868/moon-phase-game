<title>すぷらんきー あてっこ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
[hidden]{display:none!important}
.app{margin:auto;min-height:100svh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-weight:900}
.brand small{color:var(--muted)}
.sound{display:flex;gap:8px;align-items:center;border:1px solid;min-height:46px;padding:8px 16px;font-size:14px;font-weight:800;white-space:nowrap}
.sound svg,.helper svg{width:20px;height:20px;flex-shrink:0}
.play{flex:1;display:flex;flex-direction:column;align-items:center}
.progress{display:flex;align-items:center}
.stars{display:flex;gap:8px}
.star{font-size:26px;line-height:1}
.progress-label{font-size:13px;font-weight:800;color:var(--muted)}
.prompt{text-align:center;font-weight:900}
.prompt strong{display:inline-block;color:var(--green);line-height:1.18;padding:0 4px 6px}
.prompt .tail{white-space:nowrap}
.helpers{display:flex;justify-content:center}
.helper{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid;font-weight:800}
.hint{display:flex;align-items:center;justify-content:center;font-weight:800}
.hint img{object-fit:contain}
.cards{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;transition:transform .15s,border-color .15s}
.card:not(:disabled):hover{transform:translateY(-4px)}
.card:not(:disabled):active{transform:translateY(3px)}
.card img{flex:1 1 0;min-height:0;width:100%;object-fit:contain;pointer-events:none}
.card .pick{flex-shrink:0;font-weight:800;min-width:80px;margin-top:6px}
.card .mark{position:absolute;top:11px;right:12px;width:32px;height:32px;font-size:23px;font-weight:900;line-height:32px}
.feedback{font-weight:800;text-align:center}
.feedback.success{color:var(--green)}
.next,.again{border:0;font-weight:900}
.next:active,.again:active{transform:translateY(3px)}
.audio-note{color:var(--muted);text-align:center;max-width:32em;line-height:1.6}
.foot{color:var(--muted);text-align:center}
.finish{flex:1;text-align:center}
.friends{display:flex;justify-content:center;gap:8px}
.friend{flex:1;min-width:0}
.friend img{width:100%;object-fit:contain}
.friend span{display:block;margin-top:10px;font-size:13px;font-weight:800;overflow-wrap:anywhere}
.bounce{animation:celebrate .45s ease-out}
@keyframes celebrate{50%{transform:translateY(-8px)}}
@media(max-width:600px){.stars{gap:7px}.star{font-size:23px}.sound{gap:5px}.card .pick{min-width:0}.card .mark{top:7px;right:7px;width:26px;height:26px;font-size:19px;line-height:26px}.friends{gap:2px}.friend span{font-size:11px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
const GuessGame=(()=>{
 const characters=[
  {id:'oren',name:'おれん',file:'sprunki-oren.png',bg:'#fff0d9'},
  {id:'sky',name:'すかい',file:'sprunki-sky.png',bg:'#e6f3fc'},
  {id:'simon',name:'さいもん',file:'sprunki-simon.png',bg:'#fbf4ce'},
  {id:'pinki',name:'ぴんきー',file:'sprunki-pinki.png',bg:'#fbe8f0'},
  {id:'gray',name:'ぐれー',file:'sprunki-gray.png',bg:'#ecefea'},
  {id:'durple',name:'だーぷる',file:'sprunki-durple.png',bg:'#f0e8fa'},
  {id:'tunner',name:'たなー',file:'sprunki-tunner.png',bg:'#f0e8dc'},
  {id:'vineria',name:'ゔぃねりあ',file:'sprunki-vineria.png',bg:'#e6f0d9'}
 ];
 function shuffle(items,rng){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
 let runSequence=0;
 function createRunId(){try{if(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')return crypto.randomUUID();}catch{}return `guess-${Date.now()}-${++runSequence}-${Math.random().toString(36).slice(2)}`;}
 function createSession(rng=Math.random){const targets=shuffle(characters,rng).slice(0,5);return {deck:targets.map(target=>({target,choices:shuffle([target,...shuffle(characters.filter(c=>c.id!==target.id),rng).slice(0,2)],rng)})),index:0,stars:0,hintLevel:0,firstTry:0,attempted:false,runId:createRunId(),phase:'asking'};}
 function answer(state,id){if(state.phase!=='asking')return 'ignored';const q=state.deck[state.index];if(!q.choices.some(c=>c.id===id))return 'ignored';const firstAttempt=!state.attempted;state.attempted=true;if(q.target.id!==id)return 'retry';if(firstAttempt)state.firstTry++;state.stars++;state.phase='solved';return 'correct';}
 function next(state){if(state.phase!=='solved')return false;if(state.index===state.deck.length-1){state.phase='complete';}else{state.index++;state.phase='asking';state.hintLevel=0;state.attempted=false;}return true;}
 function revealHint(state){if(state.phase!=='complete')state.hintLevel=Math.min(3,state.hintLevel+1);return state.hintLevel;}
 // Only a completed round earns friends; retries and hints never affect the reward.
 function collectRound(state,owned=[]){const ids=new Set(owned.filter(id=>characters.some(c=>c.id===id))),newIds=[];if(state.phase==='complete')for(const {target}of state.deck){if(!ids.has(target.id)){ids.add(target.id);newIds.push(target.id);}}return {owned:characters.filter(c=>ids.has(c.id)).map(c=>c.id),newIds};}
 return {characters,createSession,answer,next,revealHint,collectRound};
})();
</script>

 function stopChime(){if(audioContext){const previous=audioContext;audioContext=undefined;void previous.close().catch(()=>{});}}
 function chime(){if(!sound)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioContext??=new Audio();if(audioContext.state==='suspended')void audioContext.resume().catch(()=>{});[523.25,659.25,783.99].forEach((note,i)=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),t=audioContext.currentTime+i*.12;oscillator.type='sine';oscillator.frequency.value=note;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.055,t+.02);gain.gain.exponentialRampToValueAtTime(.001,t+.28);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(t);oscillator.stop(t+.3);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};});}catch{}}

 function choose(id,session=state,index=state.index){if(session!==state||index!==state.index)return 'ignored';const result=GuessGame.answer(state,id);if(result==='ignored')return result;if(result==='retry'){$('feedback').textContent='もういちど みてみよう';speak('もういちど、みてみよう');return result;}updateStars();const target=state.deck[state.index].target;$('feedback').textContent=`そう！ ${target.name} だね！`;$('feedback').classList.add('success');for(const card of $('cards').children){card.disabled=true;if(card.dataset.id===target.id){card.classList.add('correct','bounce');card.querySelector('.pick').textContent=target.name;const mark=document.createElement('span');mark.className='mark';mark.textContent='✓';mark.setAttribute('aria-hidden','true');card.append(mark);}}$('next').hidden=false;$('next').textContent=state.stars===5?'ごほうびへ →':'つぎへ →';chime();speak(`そう！ ${target.name} だね！`);$('next').focus();return result;}
 function renderHint(){const level=state.hintLevel,target=state.deck[state.index].target;$('hint').hidden=level===0;$('hint').dataset.level=String(level);$('hintButton').setAttribute('aria-expanded',String(level>0));$('hintButton').disabled=level===3;$('hintButton').textContent=['かげを みる','いろを みる','ぜんぶ みる','おてほん'][level];$('hintCaption').textContent=['','かたちは どの こ？','いろも みえた！','この こを さがしてね'][level];$('hintImage').alt=target.name+['','の かげ','の いろの ひんと','の おてほん'][level];}
 function renderQuestion(focus=false){const q=state.deck[state.index],session=state,index=state.index;updateStars();$('play').hidden=false;$('finish').hidden=true;$('targetName').textContent=q.target.name;$('next').hidden=true;$('hintImage').src=q.target.file;$('hintColor').src=q.target.file;renderHint();$('feedback').textContent='えを たっぷしてね';$('feedback').classList.remove('success');$('cards').replaceChildren();for(const character of q.choices){const button=document.createElement('button');button.type='button';button.className='card';button.dataset.id=character.id;button.style.setProperty('--card-bg',character.bg);button.setAttribute('aria-label',`この こ！ ${character.name}を えらぶ`);const img=document.createElement('img');img.src=character.file;img.alt='';img.width=240;img.height=300;img.draggable=false;img.addEventListener('error',()=>{if(session!==state||index!==state.index||!img.isConnected)return;$('feedback').textContent='えが よみこめなかったよ。ぺーじを ひらきなおしてね';});const label=document.createElement('span');label.className='pick';label.textContent='この こ！';button.append(img,label);button.addEventListener('click',()=>choose(character.id,session,index));$('cards').append(button);}if(focus)$('prompt').focus();}
 function showFinish(){
  stopVoice();stopChime();const reward=GuessGame.collectRound(state,collection);collection=reward.owned;
  $('play').hidden=true;$('finish').hidden=false;$('friends').replaceChildren();
  $('collectionSummary').textContent=collection.length===8?'みんな なかよし！ 8 / 8':`なかよし ${collection.length} / 8`;
  for(const character of GuessGame.characters){
   const owned=collection.includes(character.id),isNew=reward.newIds.includes(character.id),box=document.createElement(owned?'button':'div');
   box.className='friend'+(owned?' owned':'')+(isNew?' new':'');box.dataset.id=character.id;
   const badge=document.createElement('span');badge.className='badge';badge.textContent=isNew?'あたらしい！':'';badge.setAttribute('aria-hidden','true');
   const portrait=document.createElement(owned?'img':'span');
   if(owned){portrait.src=character.file;portrait.alt='';box.type='button';box.setAttribute('aria-label',`${character.name}${isNew?'、あたらしい なかま':''}。なまえを きく`);
    const session=state;box.addEventListener('click',()=>{if(session!==state||state.phase!=='complete')return;stopChime();speak(character.name);box.classList.remove('bounce');void box.offsetWidth;box.classList.add('bounce');});
   }else{portrait.className='unknown';portrait.textContent='？';portrait.setAttribute('aria-hidden','true');}
   const name=document.createElement('span');name.textContent=owned?character.name:'まだ ひみつ';box.append(badge,portrait,name);$('friends').append(box);
  }
  $('finishTitle').focus();speak('ぜんぶ できたね！ みんなと なかよし！');
  if(!state.completionQueued){state.completionQueued=true;try{void Promise.resolve(window.MoonRanking?.complete({game:'guess',mode:'default',runId:state.runId,metrics:{firstTry:state.firstTry,completed:5,total:5}})).catch(()=>{});}catch{}}
 }
 function advance(){if(!GuessGame.next(state))return false;stopVoice();stopChime();if(state.phase==='complete')showFinish();else{renderQuestion(true);readQuestion();}return true;}
 function restart(){stopVoice();stopChime();state=GuessGame.createSession();renderQuestion(true);readQuestion();}
 $('listen').addEventListener('click',()=>{if(!sound){sound=true;updateSound();}readQuestion();});$('hintButton').addEventListener('click',()=>{GuessGame.revealHint(state);renderHint();});$('next').addEventListener('click',advance);$('again').addEventListener('click',restart);
 function updateSound(){$('sound').setAttribute('aria-pressed',String(sound));$('soundLabel').textContent=sound?'おと あり':'おと なし';if(!sound){stopVoice();$('audioNote').hidden=true;stopChime();}}
 $('sound').addEventListener('click',()=>{sound=!sound;updateSound();});document.addEventListener('visibilitychange',()=>{if(document.hidden){stopVoice();stopChime();}});window.addEventListener('pagehide',()=>{stopVoice();stopChime();});
 renderQuestion();
 const context=document.modelContext;if(context?.registerTool){const lifecycle=new AbortController();window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});const snapshot=()=>({phase:state.phase,stars:state.stars,question:state.index+1,target:state.deck[state.index].target.name,choices:state.phase==='asking'?state.deck[state.index].choices.map(({id,name})=>({id,name})):[]});for(const tool of [{name:'read_guess_game',description:'Read the hiragana character question and current progress.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:snapshot},{name:'answer_guess_game',description:'Select one of the currently displayed characters.',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:input=>{if(state.phase!=='asking'||!input||!state.deck[state.index].choices.some(c=>c.id===input.id))throw new Error('Select a currently displayed character.');return {result:choose(input.id),...snapshot()};}},{name:'next_guess_question',description:'Advance after a correct answer or show the final reward.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>({advanced:advance(),...snapshot()})}]){try{void Promise.resolve(context.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}}}
})();
</script>
