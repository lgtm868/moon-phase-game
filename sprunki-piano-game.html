<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11151d">
  <title>スプランキー ピアノ音ゲー</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11151d;
      --panel: #1d2430;
      --panel-2: #262f3d;
      --ink: #f7f1de;
      --muted: #b7c0ce;
      --line: rgba(247, 241, 222, 0.2);
      --accent: #50d4c6;
      --accent-2: #ffc85a;
      --danger: #ff6d6d;
      --white-key: #fffaf0;
      --white-key-edge: #cfc7b6;
      --black-key: #16191f;
      --black-key-edge: #454d59;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
      background:
        linear-gradient(140deg, rgba(80, 212, 198, 0.12), transparent 34%),
        linear-gradient(215deg, rgba(255, 200, 90, 0.12), transparent 36%),
        #11151d;
    }

    main {
      width: min(100%, 980px);
      min-height: calc(100svh - 16px);
      display: grid;
      grid-template-rows: auto minmax(190px, 1fr) auto auto auto;
      gap: 8px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: stretch;
    }

    .title-block,
    .hud {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(29, 36, 48, 0.9);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .title-block {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      min-width: 0;
    }

    .hero-face {
      width: clamp(48px, 12vw, 70px);
      height: clamp(48px, 12vw, 70px);
      object-fit: contain;
      filter: drop-shadow(0 7px 12px rgba(0, 0, 0, 0.35));
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 5.4vw, 36px);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: clamp(12px, 2.8vw, 15px);
      line-height: 1.25;
    }

    .hud {
      min-width: min(360px, 42vw);
      display: grid;
      grid-template-columns: repeat(4, minmax(64px, 1fr));
      gap: 1px;
      overflow: hidden;
    }

    .hud-item {
      display: grid;
      place-items: center;
      padding: 8px 7px;
      background: rgba(255, 255, 255, 0.025);
    }

    .hud-label {
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .hud-value {
      margin-top: 4px;
      font-size: clamp(18px, 4vw, 25px);
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      position: relative;
      min-height: 190px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px calc(100% / 24)),
        linear-gradient(180deg, #171d27 0%, #202939 62%, #171d27 100%);
      overflow: hidden;
    }

    #noteCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .lane-heads {
      position: absolute;
      inset: 8px 8px auto;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 4px;
      pointer-events: none;
    }

    .lane-head {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(17, 21, 29, 0.58);
      overflow: hidden;
    }

    .lane-head img {
      max-width: 34px;
      max-height: 34px;
      object-fit: contain;
      filter: drop-shadow(0 4px 7px rgba(0, 0, 0, 0.3));
    }

    .judge-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 20px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-2), var(--accent), transparent);
      box-shadow: 0 0 18px rgba(80, 212, 198, 0.65);
      pointer-events: none;
    }

    .judge-zone {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      height: 44px;
      background:
        linear-gradient(180deg, transparent, rgba(255, 200, 90, 0.15), transparent),
        linear-gradient(90deg, transparent, rgba(80, 212, 198, 0.2), transparent);
      border-top: 1px solid rgba(255, 200, 90, 0.42);
      border-bottom: 1px solid rgba(255, 200, 90, 0.42);
      pointer-events: none;
    }

    .judge-zone::after {
      content: "HIT";
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 248, 220, 0.74);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .feedback {
      position: absolute;
      left: 50%;
      bottom: 43px;
      transform: translateX(-50%);
      min-width: 136px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(17, 21, 29, 0.72);
      color: var(--accent-2);
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      opacity: 0;
      transition: opacity 120ms ease, transform 120ms ease;
      pointer-events: none;
    }

    .feedback.is-live {
      opacity: 1;
      transform: translate(-50%, -4px);
    }

    .feedback.is-great {
      color: #50ffd9;
      box-shadow: 0 0 24px rgba(80, 255, 217, 0.42);
    }

    .feedback.is-good {
      color: #ffc85a;
      box-shadow: 0 0 20px rgba(255, 200, 90, 0.35);
    }

    .feedback.is-bad,
    .feedback.is-miss {
      color: #ff7a7a;
      box-shadow: 0 0 22px rgba(255, 109, 109, 0.38);
    }

    .result-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(8, 11, 16, 0.78);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
      z-index: 6;
    }

    .result-overlay.is-live {
      opacity: 1;
      pointer-events: auto;
    }

    .result-card {
      width: min(100%, 420px);
      display: grid;
      gap: 10px;
      padding: 18px;
      border: 2px solid rgba(80, 255, 217, 0.78);
      border-radius: 8px;
      background: rgba(29, 36, 48, 0.96);
      text-align: center;
      box-shadow: 0 0 36px rgba(80, 255, 217, 0.3);
    }

    .result-title {
      margin: 0;
      color: #50ffd9;
      font-size: clamp(46px, 13vw, 86px);
      font-weight: 900;
      line-height: 0.9;
    }

    .result-overlay.is-failed .result-card {
      border-color: rgba(255, 109, 109, 0.84);
      box-shadow: 0 0 36px rgba(255, 109, 109, 0.28);
    }

    .result-overlay.is-failed .result-title {
      color: #ff7a7a;
    }

    .result-detail {
      color: var(--ink);
      font-size: clamp(13px, 3.2vw, 17px);
      font-weight: 900;
      line-height: 1.35;
    }

    .result-detail span {
      color: var(--muted);
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(132px, 1.35fr) repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    button,
    .switch-link {
      appearance: none;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 900;
      line-height: 1.1;
      cursor: pointer;
      text-decoration: none;
    }

    .control-button {
      min-height: 48px;
      color: #17202b;
      background: var(--accent-2);
      box-shadow: 0 5px 0 #c78e2d, 0 10px 18px rgba(0, 0, 0, 0.24);
    }

    .switch-link {
      display: grid;
      place-items: center;
      text-align: center;
    }

    .control-button.secondary {
      background: #d8edf0;
      box-shadow: 0 5px 0 #93b5bc, 0 10px 18px rgba(0, 0, 0, 0.22);
    }

    .song-control {
      min-height: 48px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      padding: 5px 7px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 900;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .song-control span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .song-current {
      min-width: 0;
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: linear-gradient(135deg, #f7f1de 0%, #dff7ff 100%);
      color: #17202b;
      font: inherit;
      font-weight: 900;
      padding: 5px 8px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 5px;
      align-items: center;
      text-align: left;
      box-shadow: inset 0 -2px 0 rgba(23, 32, 43, 0.12);
    }

    .song-current-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: #17202b;
    }

    .song-current-category {
      color: #51606f;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .difficulty-pill {
      min-width: 52px;
      padding: 7px 6px;
      border-radius: 6px;
      background: #50d4c6;
      color: #102125;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
    }

    .difficulty-pill[data-level="4"],
    .difficulty-pill[data-level="5"],
    .difficulty-pill[data-level="6"] {
      background: #ffc85a;
      color: #2f2208;
    }

    .difficulty-pill[data-level="7"],
    .difficulty-pill[data-level="8"],
    .difficulty-pill[data-level="9"],
    .difficulty-pill[data-level="10"] {
      background: #ff6d6d;
      color: #2b0b0b;
    }

    .song-picker {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.05));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 12px 26px rgba(0, 0, 0, 0.18);
    }

    .category-tabs {
      display: grid;
      gap: 6px;
    }

    .category-tab {
      min-height: 36px;
      border-radius: 7px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: none;
      text-align: left;
      padding: 7px 9px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
    }

    .category-tab.is-active {
      color: #17202b;
      background: #78e7dc;
      border-color: transparent;
      box-shadow: 0 4px 0 #399f98, 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .category-tab-count {
      min-width: 22px;
      padding: 3px 5px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.16);
      text-align: center;
      font-size: 10px;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
      gap: 7px;
      align-content: start;
      max-height: 150px;
      overflow: auto;
      padding-right: 2px;
    }

    .song-card {
      min-height: 58px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      padding: 8px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 5px;
      text-align: left;
      align-items: start;
    }

    .song-card.is-active {
      color: #17202b;
      background: linear-gradient(135deg, #ffe17a, #8af1e5);
      border-color: transparent;
      box-shadow: 0 4px 0 #b98520, 0 9px 18px rgba(0, 0, 0, 0.22);
    }

    .song-card-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.15;
    }

    .song-card-meta {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1;
    }

    .song-card.is-active .song-card-meta {
      color: #43515c;
    }

    .song-card-level {
      padding: 4px 5px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--ink);
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .song-card.is-active .song-card-level {
      background: rgba(23, 32, 43, 0.16);
      color: #17202b;
    }

    .control-button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #c78e2d, 0 5px 12px rgba(0, 0, 0, 0.24);
    }

    .piano-shell {
      display: grid;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, #222a36, #151a22);
      padding: 8px;
    }

    .keyboard-help {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 3px;
      color: var(--muted);
      font-size: clamp(8px, 1.75vw, 11px);
      text-align: center;
      font-weight: 800;
      line-height: 1;
      user-select: none;
    }

    .keyboard-help span {
      min-height: 14px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .piano {
      position: relative;
      width: 100%;
      height: clamp(132px, 22svh, 210px);
      border-radius: 8px;
      background: #0e1117;
      padding: 0 1px 1px;
      touch-action: none;
      user-select: none;
      overflow: hidden;
    }

    .white-keys,
    .black-keys {
      position: absolute;
      inset: 0 1px 1px;
    }

    .black-keys {
      pointer-events: none;
    }

    .white-keys {
      display: grid;
      grid-template-columns: repeat(14, minmax(0, 1fr));
      gap: 1px;
    }

    .piano-key {
      position: relative;
      padding: 0;
      border-radius: 0 0 7px 7px;
      overflow: hidden;
    }

    .white-key {
      height: 100%;
      border: 1px solid var(--white-key-edge);
      border-top: 0;
      background: linear-gradient(180deg, #fffdf6 0%, var(--white-key) 70%, #ded6c8 100%);
      color: #18212b;
      box-shadow: inset 0 -9px 12px rgba(0, 0, 0, 0.12);
    }

    .black-key {
      position: absolute;
      top: 0;
      width: calc((100% / 14) * 0.58);
      height: 62%;
      z-index: 4;
      pointer-events: auto;
      border: 1px solid var(--black-key-edge);
      border-top: 0;
      background: linear-gradient(180deg, #2d3440 0%, var(--black-key) 74%, #07080b 100%);
      color: #f7f1de;
      box-shadow: inset 0 -9px 10px rgba(255, 255, 255, 0.04), 0 5px 9px rgba(0, 0, 0, 0.42);
    }

    .piano-key.is-active {
      filter: brightness(1.08);
    }

    .white-key.is-active {
      background: linear-gradient(180deg, #e9fffb 0%, #b8f4ec 70%, #75cabf 100%);
    }

    .black-key.is-active {
      background: linear-gradient(180deg, #5cfff1 0%, #209a90 70%, #0b3c3a 100%);
    }

    .note-label,
    .key-label {
      position: absolute;
      left: 0;
      right: 0;
      display: block;
      text-align: center;
      pointer-events: none;
    }

    .note-label {
      bottom: 22px;
      font-size: clamp(11px, 2.5vw, 15px);
      font-weight: 900;
      line-height: 1;
    }

    .key-label {
      bottom: 7px;
      color: rgba(24, 33, 43, 0.62);
      font-size: clamp(8px, 1.9vw, 11px);
      font-weight: 900;
      line-height: 1;
    }

    .black-key .note-label {
      bottom: 25px;
      font-size: clamp(8px, 1.8vw, 11px);
      line-height: 1.05;
      padding: 0 2px;
    }

    .black-key .key-label {
      bottom: 8px;
      color: rgba(247, 241, 222, 0.72);
      font-size: clamp(7px, 1.65vw, 10px);
    }

    .character-strip {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 6px;
    }

    .character-button {
      min-height: 52px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
      padding: 4px;
      box-shadow: none;
      overflow: hidden;
    }

    .character-button.is-active {
      border-color: rgba(80, 212, 198, 0.84);
      background: rgba(80, 212, 198, 0.18);
    }

    .character-button img {
      width: 34px;
      height: 42px;
      object-fit: contain;
    }

    .character-button span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: clamp(9px, 2vw, 12px);
      text-align: left;
    }

    @media (max-width: 720px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .hud {
        min-width: 0;
      }

      .controls {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
      }

      .song-control {
        grid-column: 1 / -1;
      }

      .song-picker {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .category-tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .category-tab {
        min-height: 34px;
        padding: 6px 7px;
      }

      .song-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-height: 132px;
      }

      .character-strip {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-height: 700px) {
      body {
        padding-top: max(4px, env(safe-area-inset-top));
        padding-bottom: max(4px, env(safe-area-inset-bottom));
      }

      main {
        min-height: calc(100svh - 8px);
        grid-template-rows: auto minmax(142px, 1fr) auto auto auto;
        gap: 5px;
      }

      .title-block {
        padding: 6px 8px;
      }

      .hero-face {
        width: 42px;
        height: 42px;
      }

      .subtitle {
        display: none;
      }

      .hud-item {
        padding: 6px 4px;
      }

      .hud-value {
        font-size: 18px;
      }

      .control-button {
        min-height: 40px;
        font-size: 12px;
      }

      .song-picker {
        padding: 5px;
      }

      .category-tab {
        min-height: 30px;
        padding: 5px 6px;
      }

      .song-grid {
        max-height: 96px;
      }

      .song-card {
        min-height: 48px;
        padding: 6px;
      }

      .piano {
        height: 118px;
      }

      .character-button {
        min-height: 42px;
      }

      .character-button img {
        width: 28px;
        height: 34px;
      }
    }
  </style>
</head>
<body>
  <main aria-label="スプランキーのピアノ音ゲー">
    <section class="topbar" aria-label="ゲーム情報">
      <div class="title-block">
        <img class="hero-face" id="heroFace" src="sprunki-oren.png" alt="">
        <div>
          <h1>スプランキー ピアノ</h1>
          <p class="subtitle">C4-B5の2オクターブ鍵盤で落下ノーツを演奏</p>
        </div>
      </div>
      <div class="hud" aria-live="polite">
        <div class="hud-item"><span class="hud-label">Score</span><strong class="hud-value" id="score">0</strong></div>
        <div class="hud-item"><span class="hud-label">Combo</span><strong class="hud-value" id="combo">0</strong></div>
        <div class="hud-item"><span class="hud-label">Best</span><strong class="hud-value" id="best">0</strong></div>
        <div class="hud-item"><span class="hud-label">Hit</span><strong class="hud-value" id="stats">0/0/0</strong></div>
      </div>
    </section>

      }

      function buildNotes() {
        for (let octave = 4; octave <= 5; octave += 1) {
          for (const name of NOTE_NAMES) {
            const id = `${name}${octave}`;
            const midi = (octave + 1) * 12 + NOTE_NAMES.indexOf(name);
            const isBlack = name.includes("#");
            const note = {
              id,
              name,
              octave,
              midi,
              frequency: 440 * (2 ** ((midi - 69) / 12)),
              isBlack,
              label: isBlack ? `${name}\n${FLAT_NAMES[name]}` : (name === "C" ? id : name),
              keyLabel: KEY_BY_NOTE.get(id) || ""
            };
            notes.push(note);
            noteById.set(id, note);
            if (!isBlack) whiteNotes.push(note);
          }
        }
      }

      function createKeyButton(note, whiteIndex) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `piano-key ${note.isBlack ? "black-key" : "white-key"}`;
        button.dataset.note = note.id;
        button.setAttribute("aria-label", `${note.id} key`);
        button.innerHTML = `<span class="note-label">${note.label.replace("\n", "<br>")}</span><span class="key-label">${note.keyLabel}</span>`;
        if (note.isBlack) {
          const left = ((whiteIndex + 1) / 14) * 100;
          button.style.left = `calc(${left}% - ((100% / 14) * 0.29))`;
        }
        keyElements.set(note.id, button);
        return button;
      }

      function buildKeyboard() {
        buildNotes();
        whiteNotes.forEach((note) => whiteKeys.appendChild(createKeyButton(note, 0)));
        let whiteIndex = -1;
        notes.forEach((note) => {
          if (!note.isBlack) {
            whiteIndex += 1;
            return;
          }
          blackKeys.appendChild(createKeyButton(note, whiteIndex));
        });
        const firstOctave = notes.slice(0, 12);
        keyboardHelp.innerHTML = firstOctave.map((note) => `<span>${note.keyLabel}<br>${note.id}</span>`).join("");
      }

      function buildCharacters() {
        laneHeads.innerHTML = characters.map((character) => (
          `<div class="lane-head"><img src="${character.image}" alt=""></div>`
        )).join("");
        characters.forEach((character, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `character-button${index === selectedCharacter ? " is-active" : ""}`;
          button.innerHTML = `<img src="${character.image}" alt=""><span>${character.name}</span>`;
          button.addEventListener("click", () => {
            selectedCharacter = index;
            heroFace.src = character.image;
            document.querySelectorAll(".character-button").forEach((item, itemIndex) => {
              item.classList.toggle("is-active", itemIndex === selectedCharacter);
            });
          });
          characterStrip.appendChild(button);
        });
      }

      function buildSongSelect() {
        songSelect.innerHTML = SONGS.map((song) => (
          `<option value="${song.id}">${song.name} (Lv.${song.level})</option>`
        )).join("");
        songSelect.value = selectedSongId;
        buildCategoryTabs();
        buildSongCards();
        updateSongUi();
      }

      function selectedSong() {
        return SONGS.find((song) => song.id === selectedSongId) || SONGS[0];
      }

      function categoryForSong(songId) {
        return SONG_CATEGORIES.find((category) => category.ids.includes(songId)) || SONG_CATEGORIES[0];
      }

      function songsForCategory(categoryId) {
        const category = SONG_CATEGORIES.find((item) => item.id === categoryId) || SONG_CATEGORIES[0];
        return category.ids.map((id) => SONGS.find((song) => song.id === id)).filter(Boolean);
      }

      function selectSong(songId) {
        if (!SONGS.some((song) => song.id === songId)) return;
        selectedSongId = songId;
        selectedCategoryId = categoryForSong(songId).id;
        songSelect.value = selectedSongId;
        updateSongUi();
        resetGame();
        state.feedbackText = `${selectedSong().name} Ready`;
        state.feedbackKind = "";
        state.feedbackUntil = performance.now() + 900;
      }

      function buildCategoryTabs() {
        categoryTabs.innerHTML = "";
        SONG_CATEGORIES.forEach((category) => {
          const button = document.createElement("button");
          button.className = "category-tab";
          button.type = "button";
          button.setAttribute("role", "tab");
          button.dataset.category = category.id;
          button.innerHTML = `<span>${category.name}</span><span class="category-tab-count">${songsForCategory(category.id).length}</span>`;
          button.addEventListener("click", () => {
            selectedCategoryId = category.id;
            updateSongUi();
          });
          categoryTabs.appendChild(button);
        });
      }

      function buildSongCards() {
        songGrid.innerHTML = "";
        songsForCategory(selectedCategoryId).forEach((song) => {
          const card = document.createElement("button");
          card.className = "song-card";
          card.type = "button";
          card.setAttribute("role", "option");
          card.dataset.song = song.id;
          card.innerHTML = `<span class="song-card-title">${song.name}</span><span class="song-card-level">Lv.${song.level}</span><span class="song-card-meta">${song.bpm} BPM</span>`;
          card.addEventListener("click", () => selectSong(song.id));
          songGrid.appendChild(card);
        });
      }

      function updateSongUi() {
        const song = selectedSong();
        const category = categoryForSong(song.id);
        songCurrentName.textContent = song.name;
        songCurrentCategory.textContent = category.name;
        updateDifficultyLabel();
        document.querySelectorAll(".category-tab").forEach((tab) => {
          const active = tab.dataset.category === selectedCategoryId;
          tab.classList.toggle("is-active", active);
          tab.setAttribute("aria-selected", active ? "true" : "false");
        });
        buildSongCards();
        document.querySelectorAll(".song-card").forEach((card) => {
          const active = card.dataset.song === selectedSongId;
          card.classList.toggle("is-active", active);
          card.setAttribute("aria-selected", active ? "true" : "false");
        });
      }

      function updateDifficultyLabel() {
        const level = selectedSong().level;
        difficultyLabel.textContent = `Lv.${level}`;
        difficultyLabel.dataset.level = String(level);
      }

      function getAudioContext() {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioContext;
      }

      async function unlockAudio() {
        const context = getAudioContext();
        if (context.state === "suspended") {
          await context.resume();
        }
        return context;
      }

      function playPianoTone(note, velocity = 0.75) {
        if (!soundEnabled) return;
        try {
          const context = getAudioContext();
          if (context.state === "suspended") {
            context.resume().then(() => playPianoTone(note, velocity)).catch(() => {
              soundEnabled = false;
              updateSoundButton();
            });
            return;
          }
          const now = context.currentTime;
          const master = context.createGain();
          const low = context.createOscillator();
          const high = context.createOscillator();
          const filter = context.createBiquadFilter();
          const timbre = characters[selectedCharacter].timbre;
          low.type = timbre.low;
          high.type = timbre.high;
          low.frequency.setValueAtTime(note.frequency, now);
          high.frequency.setValueAtTime(note.frequency * 2.01, now);
          low.detune.setValueAtTime(timbre.detune, now);
          high.detune.setValueAtTime(-timbre.detune * 0.6, now);
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(timbre.filter, now);
          filter.frequency.exponentialRampToValueAtTime(Math.max(420, timbre.filter * 0.28), now + 0.45);
          master.gain.setValueAtTime(0.0001, now);
          master.gain.exponentialRampToValueAtTime(timbre.gain * velocity, now + 0.012);
          master.gain.exponentialRampToValueAtTime(timbre.gain * 0.32 * velocity, now + 0.16);
          master.gain.exponentialRampToValueAtTime(0.0001, now + timbre.decay);
          low.connect(filter);
          high.connect(filter);
          filter.connect(master).connect(context.destination);
          low.start(now);
          high.start(now);
          low.stop(now + timbre.decay + 0.04);
          high.stop(now + timbre.decay + 0.04);
        } catch (error) {
          soundEnabled = false;
          updateSoundButton();
        }
      }

      async function loadCharacterBuffer(character) {
        if (!soundEnabled || !character.audio || audioBuffers.has(character.id)) return;
        try {
          const context = await unlockAudio();
          const response = await fetch(character.audio);
          const data = await response.arrayBuffer();
          const buffer = await context.decodeAudioData(data);
          audioBuffers.set(character.id, buffer);
        } catch (error) {
          audioBuffers.set(character.id, null);
        }
      }

      function playCharacterHit() {
        if (!soundEnabled) return;
        const character = characters[selectedCharacter];
        const buffer = audioBuffers.get(character.id);
        if (!buffer) return;
        try {
          const context = getAudioContext();
          const source = context.createBufferSource();
          const gain = context.createGain();
          source.buffer = buffer;
          gain.gain.setValueAtTime(0.0001, context.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.12, context.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.28);
          source.connect(gain).connect(context.destination);
          source.start(context.currentTime, 0, Math.min(0.32, buffer.duration));
        } catch (error) {
          // Character samples are decorative; piano tone remains the playable source.
        }
      }

      function makeChart() {
        const song = selectedSong();
        const beatMs = 60000 / song.bpm;
        const chart = [];
        let beat = 0;
        let id = 0;
        for (let repeat = 0; repeat < song.repeats; repeat += 1) {
          for (const [noteId, beats] of song.pattern) {
            if (noteId) {
              chart.push({
                id,
                noteId,
                hitTime: 900 + beat * beatMs,
                judged: false,
                result: ""
              });
              if (song.id === "sprunki" && id % 12 === 6) {
                const harmony = noteId.endsWith("4") ? "C5" : "C4";
                chart.push({
                  id: id + 1000,
                  noteId: harmony,
                  hitTime: 900 + beat * beatMs,
                  judged: false,
                  result: ""
                });
              }
              id += 1;
            }
            beat += beats;
          }
          beat += 1;
        }
        return chart.sort((a, b) => a.hitTime - b.hitTime);
      }

      function resizeCanvas() {
        const bounds = stage.getBoundingClientRect();
        const ratio = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
        canvasWidth = Math.max(1, bounds.width);
        canvasHeight = Math.max(1, bounds.height);
        noteCanvas.width = Math.round(canvasWidth * ratio);
        noteCanvas.height = Math.round(canvasHeight * ratio);
        noteCanvas.style.width = `${canvasWidth}px`;
        noteCanvas.style.height = `${canvasHeight}px`;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        draw();
      }

      function startGame() {
        try {
          unlockAudio();
          characters.forEach((character) => loadCharacterBuffer(character));
        } catch (error) {
          soundEnabled = false;
          updateSoundButton();
        }
        if (state.running && state.paused) {
          const now = performance.now();
          state.pauseTotal += now - state.pauseAt;
          state.paused = false;
          state.feedbackText = "Resume";
          state.feedbackKind = "good";
          state.feedbackUntil = now + 600;
        } else {
          state = makeInitialState();
          hideResult();
          state.chart = makeChart();
          state.running = true;
          state.paused = false;
          state.startAt = performance.now();
          state.feedbackText = `${selectedSong().name} Go`;
          state.feedbackKind = "good";
          state.feedbackUntil = performance.now() + 700;
        }
        startButton.textContent = "RESTART";
        pauseButton.textContent = "PAUSE";
        updateHud();
      }

      function pauseGame() {
        if (!state.running) return;
        if (state.paused) {
          startGame();
          return;
        }
        state.paused = true;
        state.pauseAt = performance.now();
        pauseButton.textContent = "RESUME";
        state.feedbackText = "Pause";
        state.feedbackKind = "";
        state.feedbackUntil = performance.now() + 600;
      }

      function resetGame() {
        state = makeInitialState();
        startButton.textContent = "START";
        pauseButton.textContent = "PAUSE";
        hideResult();
        updateHud();
        draw();
      }

      function hideResult() {
        resultOverlay.classList.remove("is-live", "is-clear", "is-failed");
      }

      function showResult() {
        if (state.resultShown) return;
        state.resultShown = true;
        const totalHits = state.great + state.good;
        const totalNotes = Math.max(1, state.chart.length);
        const hitRate = Math.round((totalHits / totalNotes) * 100);
        const cleared = hitRate >= 70 && state.miss <= Math.max(3, Math.floor(totalNotes * 0.25));
        resultTitle.textContent = cleared ? "CLEAR" : "FAILED";
        resultDetail.innerHTML = [
          `<span>Song</span> ${selectedSong().name} / Lv.${selectedSong().level}`,
          `<span>Score</span> ${state.score}`,
          `<span>Hit</span> ${hitRate}%  Great ${state.great}  Good ${state.good}  Miss ${state.miss}`,
          `<span>Best Combo</span> ${state.best}`
        ].join("<br>");
        resultOverlay.classList.toggle("is-clear", cleared);
        resultOverlay.classList.toggle("is-failed", !cleared);
        resultOverlay.classList.add("is-live");
      }

      function updateSoundButton() {
        soundButton.textContent = soundEnabled ? "SOUND ON" : "SOUND OFF";
        soundButton.setAttribute("aria-pressed", soundEnabled ? "true" : "false");
      }

      function songTime(now) {
        if (!state.running) return state.songTime;
        if (state.paused) return state.pauseAt - state.startAt - state.pauseTotal;
        return now - state.startAt - state.pauseTotal;
      }

      function noteColumn(noteId) {
        return notes.findIndex((note) => note.id === noteId);
      }

      function keyRect(noteId) {
        const key = keyElements.get(noteId);
        if (!key) {
          const fallbackWidth = canvasWidth / notes.length;
          return { x: noteColumn(noteId) * fallbackWidth, width: fallbackWidth };
        }
        const keyBounds = key.getBoundingClientRect();
        const pianoBounds = piano.getBoundingClientRect();
        const scaleX = canvasWidth / Math.max(1, pianoBounds.width);
        return {
          x: (keyBounds.left - pianoBounds.left) * scaleX,
          width: keyBounds.width * scaleX
        };
      }

      function judgeNote(noteId, inputTime) {
        if (!state.running || state.paused) return;
        const currentTime = songTime(inputTime);
        let target = null;
        let bestDelta = Infinity;
        for (const note of state.chart) {
          if (note.judged || note.noteId !== noteId) continue;
          const delta = Math.abs(currentTime - note.hitTime);
          if (delta < bestDelta) {
            bestDelta = delta;
            target = note;
          }
        }
        if (!target || bestDelta > GOOD_MS) {
          state.feedbackText = target && currentTime < target.hitTime ? "Too Early" : "Wrong";
          state.feedbackKind = "bad";
          state.feedbackUntil = inputTime + 320;
          return;
        }
        const signedDelta = Math.round(currentTime - target.hitTime);
        target.judged = true;
        target.result = bestDelta <= GREAT_MS ? "Great" : "Good";
        target.delta = signedDelta;
        if (target.result === "Great") {
          state.score += 100;
          state.great += 1;
        } else {
          state.score += 50;
          state.good += 1;
        }
        state.combo += 1;
        state.best = Math.max(state.best, state.combo);
        state.feedbackText = `${target.result} ${signedDelta >= 0 ? "+" : ""}${signedDelta}ms`;
        state.feedbackKind = target.result.toLowerCase();
        state.feedbackUntil = inputTime + 420;
        state.hitEffects.push({ noteId, result: target.result, at: inputTime });
        playCharacterHit();
        updateHud();
      }

      function registerMisses(now) {
        if (!state.running || state.paused) return;
        const currentTime = songTime(now);
        for (const note of state.chart) {
          if (note.judged) continue;
          if (currentTime - note.hitTime > MISS_GRACE_MS) {
            note.judged = true;
            note.result = "Miss";
            state.combo = 0;
            state.miss += 1;
            state.feedbackText = "Miss";
            state.feedbackKind = "miss";
            state.feedbackUntil = now + 360;
            state.hitEffects.push({ noteId: note.noteId, result: "Miss", at: now });
          }
        }
        const lastNote = state.chart[state.chart.length - 1];
        if (lastNote && currentTime > lastNote.hitTime + 2300 && state.chart.every((note) => note.judged)) {
          state.running = false;
          startButton.textContent = "START";
          pauseButton.textContent = "PAUSE";
          showResult();
        }
      }

      function updateHud() {
        scoreEl.textContent = String(state.score);
        comboEl.textContent = String(state.combo);
        bestEl.textContent = String(state.best);
        statsEl.textContent = `${state.great}/${state.good}/${state.miss}`;
      }

      function showKey(noteId, on) {
        const element = keyElements.get(noteId);
        if (!element) return;
        element.classList.toggle("is-active", on);
        if (on) {
          clearTimeout(pressedVisualTimers.get(noteId));
          pressedVisualTimers.set(noteId, setTimeout(() => showKey(noteId, false), 140));
        }
      }

      function playInput(noteId, now = performance.now()) {
        const note = noteById.get(noteId);
        if (!note) return;
        showKey(noteId, true);
        playPianoTone(note);
        judgeNote(noteId, now);
      }

      function noteFromClientPoint(clientX, clientY) {
        const bounds = piano.getBoundingClientRect();
        const x = Math.min(Math.max(clientX - bounds.left, 0), bounds.width - 1);
        const y = Math.min(Math.max(clientY - bounds.top, 0), bounds.height - 1);
        const whiteWidth = bounds.width / whiteNotes.length;
        if (y <= bounds.height * 0.62) {
          const blackWidth = whiteWidth * 0.58;
          for (const [noteId, boundary] of BLACK_KEY_BOUNDARIES) {
            const center = boundary * whiteWidth;
            if (x >= center - blackWidth / 2 && x <= center + blackWidth / 2) {
              return noteId;
            }
          }
        }
        const whiteIndex = Math.min(whiteNotes.length - 1, Math.max(0, Math.floor(x / whiteWidth)));
        return whiteNotes[whiteIndex]?.id || null;
      }

      function noteFromPointer(event) {
        return noteFromClientPoint(event.clientX, event.clientY);
      }

      function playCoordinateInput(clientX, clientY, event, force = false) {
        const now = performance.now();
        if (!force && now - lastCoordinateInputAt < 80) return;
        const noteId = noteFromClientPoint(clientX, clientY);
        if (!noteId) return;
        lastCoordinateInputAt = now;
        activePointers.set(event.pointerId ?? `fallback-${now}`, noteId);
        playInput(noteId, now);
        event.preventDefault?.();
      }

      function handlePointerDown(event) {
        if (event.button !== undefined && event.button !== 0 && event.pointerType === "mouse") return;
        const now = performance.now();
        if (now - lastCoordinateInputAt < 80) {
          event.preventDefault();
          return;
        }
        const noteId = noteFromPointer(event);
        if (!noteId) return;
        piano.setPointerCapture?.(event.pointerId);
        lastCoordinateInputAt = now;
        activePointers.set(event.pointerId, noteId);
        playInput(noteId, now);
        event.preventDefault();
      }

      function handleMouseDown(event) {
        if (event.button !== 0) return;
        const now = performance.now();
        const noteId = noteFromClientPoint(event.clientX, event.clientY);
        if (!noteId) return;
        lastCoordinateInputAt = now;
        activePointers.set("mouse", noteId);
        playInput(noteId, now);
        event.preventDefault();
      }

      function handleMouseUp(event) {
        const noteId = activePointers.get("mouse");
        if (noteId) showKey(noteId, false);
        activePointers.delete("mouse");
        event.preventDefault?.();
      }

      function handleTouchStart(event) {
        for (const touch of Array.from(event.changedTouches || [])) {
          const now = performance.now();
          const noteId = noteFromClientPoint(touch.clientX, touch.clientY);
          if (!noteId) continue;
          activePointers.set(`touch-${touch.identifier}`, noteId);
          playInput(noteId, now);
        }
        event.preventDefault();
      }

      function handleTouchEnd(event) {
        for (const touch of Array.from(event.changedTouches || [])) {
          const key = `touch-${touch.identifier}`;
          const noteId = activePointers.get(key);
          if (noteId) showKey(noteId, false);
          activePointers.delete(key);
        }
        event.preventDefault?.();
      }

      function handlePointerUp(event) {
        const noteId = activePointers.get(event.pointerId);
        if (noteId) showKey(noteId, false);
        activePointers.delete(event.pointerId);
      }

      function handlePointerCancel(event) {
        const noteId = activePointers.get(event.pointerId);
        if (noteId) showKey(noteId, false);
        activePointers.delete(event.pointerId);
      }

      function noteFromKeyboard(event) {
        return CODE_TO_NOTE.get(event.code) || null;
      }

      function drawNotes(now = performance.now()) {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        const currentTime = songTime(now);
        const laneWidth = canvasWidth / notes.length;
        const hitY = canvasHeight - 20;
        ctx.save();
        const goodPixels = (GOOD_MS / TRAVEL_MS) * hitY;
        const greatPixels = (GREAT_MS / TRAVEL_MS) * hitY;
        ctx.fillStyle = "rgba(255, 200, 90, 0.13)";
        ctx.fillRect(0, hitY - goodPixels, canvasWidth, goodPixels * 2);
        ctx.fillStyle = "rgba(80, 255, 217, 0.17)";
        ctx.fillRect(0, hitY - greatPixels, canvasWidth, greatPixels * 2);
        ctx.fillStyle = "rgba(247, 241, 222, 0.72)";
        ctx.font = "900 11px system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText("GOOD", 8, hitY - goodPixels - 8);
        ctx.fillText("GREAT", 8, hitY);
        for (const chartNote of state.chart) {
          if (chartNote.judged) continue;
          const timeUntilHit = chartNote.hitTime - currentTime;
          if (timeUntilHit > TRAVEL_MS || timeUntilHit < -MISS_GRACE_MS) continue;
          const progress = 1 - (timeUntilHit / TRAVEL_MS);
          const rect = keyRect(chartNote.noteId);
          const x = rect.x;
          const y = progress * hitY - 18;
          const note = noteById.get(chartNote.noteId);
          const character = characters[(chartNote.id + selectedCharacter) % characters.length];
          const closeness = Math.max(0, 1 - Math.abs(timeUntilHit) / GOOD_MS);
          const inset = note.isBlack ? 0 : 1;
          const noteX = x + inset;
          const noteY = y;
          const noteW = Math.max(6, rect.width - inset * 2);
          const noteH = note.isBlack ? 30 : 24;
          ctx.fillStyle = Math.abs(timeUntilHit) <= GREAT_MS
            ? "#50ffd9"
            : note.isBlack
              ? "#10131a"
              : "#fffaf0";
          ctx.strokeStyle = note.isBlack ? "rgba(80, 255, 217, 0.92)" : character.color;
          ctx.lineWidth = 1.5 + closeness * 2.5;
          ctx.shadowColor = Math.abs(timeUntilHit) <= GOOD_MS ? "rgba(80, 255, 217, 0.75)" : "transparent";
          ctx.shadowBlur = Math.abs(timeUntilHit) <= GOOD_MS ? 12 : 0;
          roundedRect(ctx, noteX, noteY, noteW, noteH, 6);
          ctx.fill();
          ctx.stroke();
          if (note.isBlack) {
            ctx.fillStyle = "rgba(80, 255, 217, 0.9)";
            ctx.fillRect(noteX + 3, noteY + 3, Math.max(2, noteW - 6), 4);
          } else {
            ctx.fillStyle = "rgba(17, 21, 29, 0.16)";
            ctx.fillRect(noteX + 3, noteY + noteH - 5, Math.max(2, noteW - 6), 2);
          }
          ctx.shadowBlur = 0;
          ctx.fillStyle = note.isBlack ? "#f7f1de" : "#11151d";
          ctx.font = "900 9px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(note.isBlack ? "BLACK" : "WHITE", x + rect.width / 2, y + 9);
          ctx.font = "900 10px system-ui, sans-serif";
          ctx.fillText(chartNote.noteId.replace("#", "♯"), x + rect.width / 2, y + (note.isBlack ? 22 : 17));
        }
        state.hitEffects = state.hitEffects.filter((effect) => now - effect.at < 520);
        for (const effect of state.hitEffects) {
          const age = now - effect.at;
          const alpha = 1 - age / 520;
          const rect = keyRect(effect.noteId);
          const x = rect.x + rect.width / 2;
          const radius = 8 + age * 0.08;
          ctx.strokeStyle = effect.result === "Great"
            ? `rgba(80, 255, 217, ${alpha})`
            : effect.result === "Good"
              ? `rgba(255, 200, 90, ${alpha})`
              : `rgba(255, 109, 109, ${alpha})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(x, hitY, radius, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function roundedRect(context, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.lineTo(x + width - r, y);
        context.quadraticCurveTo(x + width, y, x + width, y + r);
        context.lineTo(x + width, y + height - r);
        context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        context.lineTo(x + r, y + height);
        context.quadraticCurveTo(x, y + height, x, y + height - r);
        context.lineTo(x, y + r);
        context.quadraticCurveTo(x, y, x + r, y);
      }

      function draw(now = performance.now()) {
        drawNotes(now);
        feedbackEl.classList.remove("is-great", "is-good", "is-bad", "is-miss");
        if (now < state.feedbackUntil) {
          feedbackEl.textContent = state.feedbackText;
          feedbackEl.classList.add("is-live");
          if (state.feedbackKind) feedbackEl.classList.add(`is-${state.feedbackKind}`);
        } else {
          feedbackEl.classList.remove("is-live");
        }
      }

      function tick(now) {
        const elapsed = now - lastFrame;
        lastFrame = now;
        if (elapsed < 1000) registerMisses(now);
        draw(now);
        updateHud();
        animationId = requestAnimationFrame(tick);
      }

      buildKeyboard();
      buildCharacters();
      buildSongSelect();
      updateSoundButton();
      updateHud();
      resizeCanvas();
      animationId = requestAnimationFrame(tick);

      startButton.addEventListener("click", startGame);
      pauseButton.addEventListener("click", pauseGame);
      resetButton.addEventListener("click", resetGame);
      songCurrent.addEventListener("click", () => {
        selectedCategoryId = categoryForSong(selectedSongId).id;
        updateSongUi();
      });
      songSelect.addEventListener("change", () => {
        selectSong(songSelect.value);
      });
      if ("PointerEvent" in window) {
        piano.addEventListener("pointerdown", handlePointerDown);
        piano.addEventListener("pointerup", handlePointerUp);
        piano.addEventListener("pointercancel", handlePointerCancel);
        piano.addEventListener("pointerleave", handlePointerCancel);
      } else {
        piano.addEventListener("mousedown", handleMouseDown);
        piano.addEventListener("mouseup", handleMouseUp);
        piano.addEventListener("mouseleave", handleMouseUp);
        piano.addEventListener("touchstart", handleTouchStart, { passive: false });
        piano.addEventListener("touchend", handleTouchEnd, { passive: false });
        piano.addEventListener("touchcancel", handleTouchEnd, { passive: false });
      }
      soundButton.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        updateSoundButton();
        if (soundEnabled) {
          try {
            unlockAudio();
            characters.forEach((character) => loadCharacterBuffer(character));
          } catch (error) {
            soundEnabled = false;
            updateSoundButton();
          }
        }
      });

      window.addEventListener("keydown", (event) => {
        if (event.repeat) return;
        const noteId = noteFromKeyboard(event);
        if (!noteId) return;
        activeKeys.set(event.code, noteId);
        playInput(noteId, performance.now());
        event.preventDefault();
      });

      window.addEventListener("keyup", (event) => {
        const noteId = activeKeys.get(event.code);
        if (!noteId) return;
        showKey(noteId, false);
        activeKeys.delete(event.code);
      });

      window.addEventListener("resize", resizeCanvas, { passive: true });
      window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 150), { passive: true });
      window.addEventListener("beforeunload", () => cancelAnimationFrame(animationId));
    })();
  </script>
</body>
</html>
